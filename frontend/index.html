<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACR Championship</title>
    <script src="https://cdn.tailwindcss.com" data-cfasync="false"></script>
    <!-- Carichiamo Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f0f1a; color: white; font-family: sans-serif; }
        .glass { background: rgba(26, 26, 46, 0.8); backdrop-filter: blur(10px); border: 1px solid #333; }
        .tab-btn { padding: 8px 16px; border-radius: 4px; transition: all 0.2s; }
        .tab-active { background-color: #e94560; color: white; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- NAVBAR -->
    <nav class="w-full max-w-6xl flex justify-between items-center mb-8 bg-[#16213e] p-4 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-[#e94560]">🏁 ACR Championship</h1>
        <div class="space-x-4 flex items-center">
            <a href="/" class="text-white hover:text-[#4ecca3] transition-colors">Area Pubblica</a>
            
            <div id="authSection">
                <button id="btnLogin" class="text-white hover:text-[#4ecca3] transition-colors border-l border-gray-600 pl-4">🔒 Login Admin</button>
                <a href="?admin=true" id="linkAdmin" class="hidden text-[#4ecca3] font-bold border-l border-gray-600 pl-4 hover:text-white">⚙️ Area Admin</a>
                <button id="btnLogout" class="hidden text-red-400 hover:text-red-300 border-l border-gray-600 pl-4">Esci</button>
            </div>
        </div>
    </nav>

    <!-- MODALE DI LOGIN -->
    <div id="loginModal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
        <div class="glass p-8 rounded-lg w-96 shadow-2xl">
            <h2 class="text-2xl font-bold text-[#e94560] mb-4">Accesso Riservato</h2>
            <input type="email" id="loginEmail" placeholder="Email" class="w-full bg-[#0f0f1a] text-white p-2 mb-3 rounded border border-gray-600">
            <input type="password" id="loginPassword" placeholder="Password" class="w-full bg-[#0f0f1a] text-white p-2 mb-4 rounded border border-gray-600">
            <div class="flex justify-between">
                <button id="btnCancelLogin" class="text-gray-400 hover:text-white">Annulla</button>
                <button id="btnDoLogin" class="bg-[#e94560] text-white px-4 py-2 rounded hover:bg-[#d13a55]">Accedi</button>
            </div>
            <p id="loginError" class="text-red-400 text-sm mt-3 hidden"></p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VISTA PUBBLICA (Visibile di default)       -->
    <!-- ========================================== -->
    <!-- NOTA: Rimosso 'hidden' da questo div -->
    <div id="view-public" class="w-full max-w-6xl">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-lg h-fit">
                <h2 class="text-xl font-bold text-[#4ecca3] mb-4 border-b border-gray-700 pb-2">📅 Calendario Eventi</h2>
                <div id="calendarList" class="space-y-3"><p class="text-gray-400 text-sm">Caricamento eventi...</p></div>
            </div>
            <div class="glass p-6 rounded-lg md:col-span-2">
                <h2 class="text-xl font-bold text-[#4ecca3] mb-4 border-b border-gray-700 pb-2">🏆 Classifiche Ufficiali</h2>
                <div class="flex space-x-2 mb-4">
                    <button class="tab-btn tab-active" onclick="setTab('rally', event)">Rally (Punti)</button>
                    <button class="tab-btn bg-[#0f0f1a] hover:bg-[#16213e]" onclick="setTab('leg', event)">Leg (Tempi)</button>
                    <button class="tab-btn bg-[#0f0f1a] hover:bg-[#16213e]" onclick="setTab('stage', event)">Stage (Tempi)</button>
                </div>
                <div class="flex items-center space-x-2 mb-4 bg-[#0f0f1a] p-3 rounded border border-gray-700">
                    <label class="text-sm text-gray-400">Inserisci ID:</label>
                    <input type="number" id="standingsId" value="1" class="bg-[#16213e] text-white p-1 rounded border border-gray-600 w-20 text-center">
                    <button onclick="loadStandings()" class="bg-[#e94560] text-white px-4 py-1 rounded hover:bg-[#d13a55]">Carica</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-[#0f0f1a] text-[#e94560] text-xs uppercase">
                                <th class="p-3 border-b border-gray-600 w-12 text-center">Pos</th>
                                <th class="p-3 border-b border-gray-600">Pilota</th>
                                <th class="p-3 border-b border-gray-600">Tempo / Gap</th>
                                <th class="p-3 border-b border-gray-600 text-right" id="extraColHead"></th>
                            </tr>
                        </thead>
                        <tbody id="standingsBody" class="text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VISTA ADMIN                                -->
    <!-- ========================================== -->
    <div id="view-admin" class="w-full max-w-5xl hidden">
        <!-- Setup -->
        <div class="glass p-6 rounded-lg mb-6">
            <h2 class="text-xl font-bold text-[#4ecca3] mb-4">1. Setup Gara</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Rally</label>
                    <select id="selectRally" class="w-full bg-[#0f0f1a] text-white p-2 rounded border border-gray-600"><option value="">Seleziona...</option></select>
                    <button id="btnNewRally" class="text-xs text-[#e94560] mt-1 hover:underline">+ Nuovo Rally</button>
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Leg</label>
                    <select id="selectLeg" class="w-full bg-[#0f0f1a] text-white p-2 rounded border border-gray-600" disabled><option value="">Seleziona...</option></select>
                    <button id="btnNewLeg" class="text-xs text-[#e94560] mt-1 hover:underline hidden" disabled>+ Nuovo Leg</button>
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Nome Stage (es. SS1)</label>
                    <input type="text" id="stageName" placeholder="SS1" class="w-full bg-[#0f0f1a] text-white p-2 rounded border border-gray-600">
                </div>
                <div class="flex items-end">
                    <button onclick="loadSetup()" class="bg-[#16213e] text-white px-3 py-2 rounded border border-gray-600 text-sm w-full hover:bg-gray-700">Aggiorna Dati</button>
                </div>
            </div>
        </div>
        <!-- Upload -->
        <div class="glass p-6 rounded-lg">
            <h2 class="text-xl font-bold text-[#4ecca3] mb-4">2. Carica Screenshot</h2>
            <input type="file" id="fileInput" accept="image/*" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-[#e94560] file:text-white hover:file:bg-[#d13a55] cursor-pointer mb-4">
            <button id="uploadBtn" class="w-full bg-[#4ecca3] text-black font-bold py-3 rounded hover:bg-[#3bb890] transition-colors hidden mb-4">Estrai Dati con OCR</button>
            <div id="loading" class="text-center hidden mb-4"><p class="text-[#4ecca3] animate-pulse">Elaborazione in corso...</p></div>
            <div id="resultBox" class="hidden border-t border-gray-700 pt-4 mt-4">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="trackName" class="text-lg font-semibold text-white">Tracciato</h3>
                    <button id="saveBtn" class="bg-[#e94560] text-white font-bold py-2 px-6 rounded hover:bg-[#d13a55] shadow-lg shadow-[#e94560]/30">💾 Conferma e Salva</button>
                </div>
                <div class="overflow-x-auto max-h-96 overflow-y-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="sticky top-0 bg-[#16213e]">
                            <tr class="text-[#e94560] text-xs uppercase">
                                <th class="p-2 border-b border-gray-600 text-center w-12">Pos</th>
                                <th class="p-2 border-b border-gray-600">Pilota</th>
                                <th class="p-2 border-b border-gray-600">Auto</th>
                                <th class="p-2 border-b border-gray-600 w-28">Tempo</th>
                                <th class="p-2 border-b border-gray-600 w-24">Gap</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ INSERISCI QUI LE TUE CHIAVI DI SUPABASE ⚠️
        const SUPABASE_URL = 'https://rvqorpdebooklqtjbnwl.supabase.coo'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2cW9ycGRlYm9va2xxdGpibndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMTk2ODIsImV4cCI6MjEwNzg5NTY4Mn0.oaw45keCaaP40J9nfVLaggIyzPJBT-X0XerqlMc5iMk';
        
        const API_BASE = 'https://acr-backend-wv98.onrender.com/api';
        const inputStyle = "w-full bg-transparent border-0 focus:ring-1 focus:ring-[#4ecca3] rounded px-1 py-0.5 text-white";

        // 1. INIZIALIZZAZIONE SICURA
        let supabase = null;
        try {
            if (SUPABASE_URL !== 'https://rvqorpdebooklqtjbnwl.supabase.co') {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } else {
                console.warn("Supabase non configurato. Il login non funzionerà.");
            }
        } catch (e) {
            console.error("Errore nell'inizializzazione di Supabase:", e);
        }

        // 2. GESTIONE AUTENTICAZIONE (Senza bloccare il sito se fallisce)
        async function checkAuth() {
            const btnLogin = document.getElementById('btnLogin');
            const linkAdmin = document.getElementById('linkAdmin');
            const btnLogout = document.getElementById('btnLogout');
            const viewPublic = document.getElementById('view-public');
            const viewAdmin = document.getElementById('view-admin');
            const urlParams = new URLSearchParams(window.location.search);

            // Se Supabase non è configurato, mostra solo la vista pubblica
            if (!supabase) {
                viewPublic.classList.remove('hidden');
                viewAdmin.classList.add('hidden');
                loadCalendar();
                loadStandings();
                return;
            }

            try {
                const { data: { session } } = await supabase.auth.getSession();

                if (session) {
                    // LOGGATO
                    btnLogin.classList.add('hidden');
                    btnLogout.classList.remove('hidden');
                    linkAdmin.classList.remove('hidden');
                    
                    if (urlParams.get('admin') === 'true') {
                        viewPublic.classList.add('hidden');
                        viewAdmin.classList.remove('hidden');
                        loadSetup();
                    } else {
                        viewPublic.classList.remove('hidden');
                        viewAdmin.classList.add('hidden');
                        loadCalendar();
                        loadStandings();
                    }
                } else {
                    // NON LOGGATO
                    btnLogin.classList.remove('hidden');
                    btnLogout.classList.add('hidden');
                    linkAdmin.classList.add('hidden');
                    
                    viewPublic.classList.remove('hidden');
                    viewAdmin.classList.add('hidden');
                    loadCalendar();
                    loadStandings();
                }
            } catch (err) {
                console.error("Errore auth:", err);
                // In caso di errore, mostra la vista pubblica di default
                viewPublic.classList.remove('hidden');
                viewAdmin.classList.add('hidden');
            }
        }

        // 3. LISTENER PULSANTI AUTH
        document.getElementById('btnLogin').addEventListener('click', () => {
            document.getElementById('loginModal').classList.remove('hidden');
        });
        
        document.getElementById('btnCancelLogin').addEventListener('click', () => {
            document.getElementById('loginModal').classList.add('hidden');
        });

        document.getElementById('btnDoLogin').addEventListener('click', async () => {
            if (!supabase) {
                alert("Supabase non è configurato. Controlla il codice.");
                return;
            }
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorMsg = document.getElementById('loginError');

            const { error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
            } else {
                document.getElementById('loginModal').classList.add('hidden');
                errorMsg.classList.add('hidden');
                checkAuth();
            }
        });

        document.getElementById('btnLogout').addEventListener('click', async () => {
            if (supabase) await supabase.auth.signOut();
            window.location.href = '/';
        });

        // 4. AVVIO
        checkAuth();

        // ==========================================
        // LOGICA VISTA PUBBLICA
        // ==========================================
        async function loadCalendar() {
            try {
                const res = await fetch(`${API_BASE}/calendar`);
                const data = await res.json();
                const list = document.getElementById('calendarList');
                list.innerHTML = '';
                
                if (data.length === 0) {
                    list.innerHTML = '<p class="text-gray-500 text-sm italic">Nessun evento in calendario.</p>';
                    return;
                }

                data.forEach(r => {
                    const date = new Date(r.created_at).toLocaleDateString('it-IT');
                    list.innerHTML += `
                        <div class="bg-[#0f0f1a] p-3 rounded border border-gray-700 hover:border-[#4ecca3] transition-colors cursor-pointer" onclick="document.getElementById('standingsId').value='${r.id}'; setTab('rally', null)">
                            <p class="font-bold text-white text-sm">${r.name}</p>
                            <p class="text-xs text-gray-500">${date}</p>
                        </div>
                    `;
                });
            } catch (e) { console.error("Errore calendario:", e); }
        }

        let currentTab = 'rally';
        
        function setTab(tab, event) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('bg-[#0f0f1a]', 'hover:bg-[#16213e]');
            });
            if (event) {
                event.target.classList.remove('bg-[#0f0f1a]', 'hover:bg-[#16213e]');
                event.target.classList.add('tab-active');
            }
            loadStandings();
        }

        async function loadStandings() {
            const id = document.getElementById('standingsId').value;
            const tbody = document.getElementById('standingsBody');
            tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Caricamento...</td></tr>';

            try {
                const res = await fetch(`${API_BASE}/standings/${currentTab}/${id}`);
                const data = await res.json();
                
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Nessun dato per questo ID.</td></tr>';
                    return;
                }

                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-gray-700 hover:bg-[#16213e] transition-colors";
                    
                    let gapDisplay = row.gap_first || '-';
                    if (currentTab === 'stage') gapDisplay = row.gap || '-';
                    
                    let extra = '';
                    if (currentTab === 'rally') {
                        extra = `<td class="p-3 font-bold text-[#f5a623] text-right">${row.points} pt</td>`;
                        document.getElementById('extraColHead').textContent = "Punti";
                    } else {
                        document.getElementById('extraColHead').textContent = "";
                    }

                    tr.innerHTML = `
                        <td class="p-3 text-center font-bold text-[#4ecca3]">${row.position}</td>
                        <td class="p-3 font-semibold text-white">${row.driver || row.driver_name}</td>
                        <td class="p-3 font-mono text-gray-300">
                            ${row.time_str || row.total_str} 
                            <span class="text-red-400 text-xs ml-2">${gapDisplay !== '-' ? gapDisplay : ''}</span>
                        </td>
                        ${extra}
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-400">Errore di caricamento</td></tr>`;
            }
        }

        // ==========================================
        // LOGICA VISTA ADMIN
        // ==========================================
        let dbRallys = [];
        async function loadSetup() {
            try {
                const res = await fetch(`${API_BASE}/setup`);
                const data = await res.json();
                dbRallys = data.rallys;
                
                const selectRally = document.getElementById('selectRally');
                selectRally.innerHTML = '<option value="">Seleziona...</option>';
                dbRallys.forEach(r => {
                    selectRally.innerHTML += `<option value="${r.id}">${r.name}</option>`;
                });
            } catch (e) { console.error("Errore setup", e); }
        }

        document.getElementById('selectRally').addEventListener('change', (e) => {
            const rallyId = e.target.value;
            const selectLeg = document.getElementById('selectLeg');
            const btnNewLeg = document.getElementById('btnNewLeg');
            
            if (!rallyId) {
                selectLeg.innerHTML = '<option value="">Seleziona...</option>';
                selectLeg.disabled = true;
                btnNewLeg.classList.add('hidden');
                return;
            }
            const rally = dbRallys.find(r => r.id == rallyId);
            selectLeg.innerHTML = '<option value="">Seleziona...</option>';
            if (rally.leg) {
                rally.leg.forEach(l => {
                    selectLeg.innerHTML += `<option value="${l.id}">${l.name}</option>`;
                });
            }
            selectLeg.disabled = false;
            btnNewLeg.classList.remove('hidden');
            btnNewLeg.disabled = false;
        });

        document.getElementById('btnNewRally').addEventListener('click', async () => {
            const name = prompt("Nome del nuovo Rally:");
            if (!name) return;
            await fetch(`${API_BASE}/create-rally`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            loadSetup();
        });

        document.getElementById('btnNewLeg').addEventListener('click', async () => {
            const rallyId = document.getElementById('selectRally').value;
            const name = prompt("Nome del nuovo Leg (es. Leg 1):");
            if (!name || !rallyId) return;
            await fetch(`${API_BASE}/create-leg`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rally_id: rallyId, name })
            });
            document.getElementById('selectRally').dispatchEvent(new Event('change'));
        });

        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) uploadBtn.classList.remove('hidden');
        });

        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('screenshot', file);

            uploadBtn.classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE}/upload`, { method: 'POST', body: formData });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('trackName').textContent = data.track_name;
                    const tbody = document.getElementById('tableBody');
                    tbody.innerHTML = '';
                    
                    data.parsed_data.forEach((row, index) => {
                        if (index > 0 && data.parsed_data.slice(0, index).some(r => r.driver === row.driver)) return; 

                        const tr = document.createElement('tr');
                        tr.className = "border-b border-gray-700 hover:bg-[#16213e]";
                        tr.innerHTML = `
                            <td class="p-2 text-center font-bold text-[#4ecca3]">${row.position}</td>
                            <td class="p-2"><input type="text" class="${inputStyle} font-semibold" value="${row.driver || ''}" data-field="driver"></td>
                            <td class="p-2"><input type="text" class="${inputStyle} text-gray-400 text-xs" value="${row.car || ''}" data-field="car"></td>
                            <td class="p-2"><input type="text" class="${inputStyle} text-gray-300 font-mono" value="${row.time || ''}" data-field="time"></td>
                            <td class="p-2"><input type="text" class="${inputStyle} text-red-400 font-mono" value="${row.gap || '-'}" data-field="gap"></td>
                        `;
                        tbody.appendChild(tr);
                    });
                    document.getElementById('resultBox').classList.remove('hidden');
                } else {
                    alert("Errore OCR: " + data.error);
                }
            } catch (error) {
                alert("Errore di rete: " + error.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                uploadBtn.classList.remove('hidden');
            }
        });

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const legId = document.getElementById('selectLeg').value;
            const stageName = document.getElementById('stageName').value;
            const trackName = document.getElementById('trackName').textContent;
            
            if (!legId || !stageName) {
                alert("⚠️ Seleziona un Rally, un Leg e inserisci il nome dello Stage prima di salvare.");
                return;
            }

            const finalData = [];
            document.querySelectorAll('#tableBody tr').forEach((tr, index) => {
                const inputs = tr.querySelectorAll('input');
                finalData.push({
                    position: index + 1,
                    driver: inputs[0].value,
                    car: inputs[1].value,
                    time: inputs[2].value,
                    gap: inputs[3].value,
                    penalty: "-"
                });
            });

            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.textContent = "Salvataggio...";

            try {
                const response = await fetch(`${API_BASE}/save-stage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ leg_id: legId, stage_name: stageName, track_name: trackName, results: finalData })
                });
                const result = await response.json();
                
                if (result.success) {
                    alert("✅ " + result.message);
                    document.getElementById('resultBox').classList.add('hidden');
                    document.getElementById('stageName').value = '';
                    fileInput.value = '';
                } else {
                    alert("❌ Errore: " + result.error);
                }
            } catch (error) {
                alert("❌ Errore di rete: " + error.message);
            } finally {
                btn.disabled = false; btn.textContent = "💾 Conferma e Salva";
            }
        });
    </script>
</body>
</html>
