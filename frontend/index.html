<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifiche - ACR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { vrg: { bg: '#0B1120', sidebar: '#0F172A', card: '#1E293B', accent: '#EAB308', text: '#94A3B8' } } } } }
    </script>
    <style>
        /* Transizioni per le colonne e gli elementi */
        .col-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Scrollbar personalizzata (stile racing) */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #EAB308; }

        /* Effetto grigio per gli elementi non selezionati */
        .dimmed { opacity: 0.4; filter: grayscale(80%); transform: scale(0.98); }
        .active-item { opacity: 1; filter: grayscale(0%); border-color: #EAB308 !important; box-shadow: 0 0 15px rgba(234, 179, 8, 0.2); }
    </style>
</head>
<body class="bg-vrg-bg text-vrg-text font-sans h-screen flex flex-col overflow-hidden">

    <!-- HEADER GLOBALE -->
    <header class="bg-vrg-sidebar border-b border-slate-800 px-6 py-4 flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-2">
            <div class="text-vrg-accent text-2xl font-bold italic tracking-tighter">VRG</div>
            <span class="text-slate-600">|</span>
            <h1 class="text-xl font-bold text-white tracking-wide">Classifiche</h1>
        </div>
        <div id="header-nav" class="flex items-center gap-4">
            <div class="text-slate-500 text-sm"><i class="fa-solid fa-spinner fa-spin"></i></div>
        </div>
    </header>

    <!-- AREA PRINCIPALE (3 COLONNE) -->
    <main class="flex-1 flex overflow-hidden p-4 gap-4 justify-center">
        
        <!-- COLONNA 1: CAMPIONATI -->
        <div id="col-championships" class="col-transition w-full max-w-4xl flex flex-col gap-4 overflow-y-auto pr-2">
            <h2 class="text-2xl font-bold text-white mb-2">Scegli un Campionato</h2>
            <div id="champ-list" class="flex flex-col gap-4">
                <!-- Popolato via JS -->
            </div>
        </div>

        <!-- COLONNA 2: RALLY E LEG -->
        <div id="col-rallies" class="col-transition w-0 opacity-0 overflow-hidden flex flex-col gap-4">
            <div class="flex items-center justify-between mb-2">
                <h2 id="rallies-title" class="text-2xl font-bold text-white">Rally</h2>
                <button onclick="resetToChamp()" class="text-sm text-vrg-accent hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="rally-list" class="flex flex-col gap-3 overflow-y-auto pr-2 pb-10">
                <!-- Popolato via JS -->
            </div>
        </div>

        <!-- COLONNA 3: STAGE -->
        <div id="col-stages" class="col-transition w-0 opacity-0 overflow-hidden flex flex-col gap-4">
            <div class="flex items-center justify-between mb-2">
                <h2 id="stages-title" class="text-2xl font-bold text-white">Stage</h2>
                <button onclick="resetToRally()" class="text-sm text-vrg-accent hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="stage-list" class="flex flex-col gap-3 overflow-y-auto pr-2 pb-10">
                <!-- Popolato via JS -->
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>

    <script>
        // Stato Globale
        const state = {
            championships: [],
            currentChamp: null,
            currentTree: null,
            selectedLeg: null
        };

        document.addEventListener('DOMContentLoaded', async () => {
            // Auth UI
            const sb = window.supabaseClient || window.supabase;
            const { data: { session } } = await sb.auth.getSession();
            const nav = document.getElementById('header-nav');
            if (session) {
                nav.innerHTML = `<span class="text-sm text-slate-400">${session.user.email}</span><button onclick="window.supabaseClient.auth.signOut().then(()=>window.location.reload())" class="text-slate-400 hover:text-red-400"><i class="fa-solid fa-power-off"></i></button>`;
            } else {
                nav.innerHTML = `<a href="login.html" class="bg-vrg-accent hover:bg-yellow-500 text-black px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2"><i class="fa-solid fa-user-lock"></i> Accedi</a>`;
            }

            await loadChampionships();
        });

        // =========================================================
        // GESTIONE COLONNE (Animazioni)
        // =========================================================
        function setLayoutState(stateName) {
            const col1 = document.getElementById('col-championships');
            const col2 = document.getElementById('col-rallies');
            const col3 = document.getElementById('col-stages');

            // Aggiungiamo h-[calc(100vh-100px)] per far apparire lo scroll interno alle colonne se sono lunghe
            if (stateName === 'home') {
                col1.className = 'col-transition w-full max-w-4xl flex flex-col gap-4 overflow-y-auto pr-2 h-[calc(100vh-100px)]';
                col2.className = 'col-transition w-0 opacity-0 overflow-hidden flex flex-col gap-4 h-[calc(100vh-100px)]';
                col3.className = 'col-transition w-0 opacity-0 overflow-hidden flex flex-col gap-4 h-[calc(100vh-100px)]';
            } 
            else if (stateName === 'champ') {
                col1.className = 'col-transition w-1/3 flex flex-col gap-4 overflow-y-auto pr-2 h-[calc(100vh-100px)]';
                col2.className = 'col-transition w-2/3 flex flex-col gap-4 opacity-100 fade-in h-[calc(100vh-100px)]';
                col3.className = 'col-transition w-0 opacity-0 overflow-hidden flex flex-col gap-4 h-[calc(100vh-100px)]';
            } 
            else if (stateName === 'leg') {
                // NOTA: Rimosso opacity-50 da col2. Non si grigia!
                col1.className = 'col-transition w-1/4 flex flex-col gap-4 overflow-y-auto pr-2 h-[calc(100vh-100px)]';
                col2.className = 'col-transition w-1/3 flex flex-col gap-4 opacity-100 h-[calc(100vh-100px)] overflow-y-auto pr-2';
                col3.className = 'col-transition w-5/12 flex flex-col gap-4 opacity-100 fade-in h-[calc(100vh-100px)]';
            }
        }

        // =========================================================
        // COLONNA 1: CAMPIONATI
        // =========================================================
        async function loadChampionships() {
            try {
                const res = await apiJson('/championships');
                state.championships = res.data || [];
                renderChampionships();
                
                // Deep Linking
                const urlParams = new URLSearchParams(window.location.search);
                const champId = urlParams.get('id');
                if (champId) {
                    const champ = state.championships.find(c => c.id == champId);
                    if (champ) selectChampionship(champ);
                }
            } catch (e) {
                document.getElementById('champ-list').innerHTML = `<div class="text-red-400">Errore: ${e.message}</div>`;
            }
        }

        function renderChampionships() {
            const list = document.getElementById('champ-list');
            list.innerHTML = state.championships.map(c => `
                <div onclick="selectChampionshipById(${c.id})" id="champ-card-${c.id}" class="champ-card bg-vrg-card border border-slate-700 rounded-xl p-6 cursor-pointer transition-all hover:border-vrg-accent group flex flex-col gap-4">
                    <div>
                        <h3 class="text-xl font-bold text-white mb-2 group-hover:text-vrg-accent transition-colors">${c.name}</h3>
                        <p class="text-sm text-slate-400"><i class="fa-solid fa-trophy mr-2"></i> Clicca per esplorare</p>
                    </div>
                    <!-- QUESTO È IL CONTENITORE (B2): è nascosto e vuoto, verrà riempito dopo -->
                    <div id="champ-matrix-container-${c.id}" class="hidden w-full mt-2"></div>
                </div>
            `).join('');
        }

        async function selectChampionshipById(id) {
            const champ = state.championships.find(c => c.id == id);
            if (champ) selectChampionship(champ);
        }

                async function selectChampionship(champ) {
            state.currentChamp = champ;
            
            // Effetto visivo
            document.querySelectorAll('.champ-card').forEach(el => {
                el.classList.add('dimmed');
                el.classList.remove('active-item');
            });
            const activeCard = document.getElementById(`champ-card-${champ.id}`);
            if(activeCard) {
                activeCard.classList.remove('dimmed');
                activeCard.classList.add('active-item');
            }

            setLayoutState('champ');
            document.getElementById('rallies-title').innerHTML = `<i class="fa-solid fa-flag-checkered text-vrg-accent mr-2"></i> ${champ.name}`;
            document.getElementById('rally-list').innerHTML = `<div class="flex justify-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl text-vrg-accent"></i></div>`;
            
            window.history.pushState({}, '', `?id=${champ.id}`);

            // Prepariamo il contenitore della tabella per mostrare il caricamento
            const matrixContainer = document.getElementById(`champ-matrix-container-${champ.id}`);
            matrixContainer.classList.remove('hidden');
            matrixContainer.innerHTML = `<div class="text-xs text-slate-500 animate-pulse border-t border-slate-700 pt-3 mt-2"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Caricamento punteggi...</div>`;

            try {
                // 1. Carica i dati dei Rally/Leg
                const res = await apiJson(`/tree/${champ.id}`);
                if (res.success) {
                    state.currentTree = res.data;
                    renderRallies(res.data.rallies);
                }

                // 2. Carica la matrice dei punteggi Campionato
                const matrixRes = await apiJson(`/standings/matrix/championship/${champ.id}`);
                // Inserisce la tabella nel contenitore
                matrixContainer.innerHTML = renderMatrixHTML(matrixRes, 'championship');
                
            } catch (e) {
                document.getElementById('rally-list').innerHTML = `<div class="text-red-400">Errore: ${e.message}</div>`;
                matrixContainer.innerHTML = '';
            }
        }

        // =========================================================
        // COLONNA 2: RALLY E LEG (Accordion)
        // =========================================================
                // =========================================================
        // COLONNA 2: RALLY E LEG
        // =========================================================
        function renderRallies(rallies) {
            const list = document.getElementById('rally-list');
            if (!rallies || rallies.length === 0) {
                list.innerHTML = `<div class="text-slate-500 text-center py-8">Nessun rally in questo campionato.</div>`;
                return;
            }

            list.innerHTML = rallies.map(r => `
                <div class="bg-vrg-card border border-slate-700 rounded-xl overflow-hidden mb-3">
                    <div onclick="toggleRally(${r.id})" class="p-4 cursor-pointer flex justify-between items-center hover:bg-slate-800 transition-colors">
                        <div>
                            <h3 class="font-bold text-lg text-white">${r.name}</h3>
                            <div class="text-[11px] text-slate-400 mt-1 flex gap-3">
                                <span><i class="fa-solid fa-road"></i> ${r.total_legs} Leg</span>
                                <span><i class="fa-solid fa-stopwatch"></i> ${r.total_stages} Stage</span>
                                <span><i class="fa-solid fa-ruler-horizontal"></i> ${r.total_km} km</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down text-slate-500 transition-transform" id="chevron-rally-${r.id}"></i>
                    </div>
                    
                    <div id="rally-body-${r.id}" class="hidden border-t border-slate-700 bg-slate-900/80 p-3">
                        <div id="rally-points-${r.id}"></div>
                        
                        <h4 class="text-[10px] uppercase text-slate-500 font-bold mt-4 mb-2">Elenco Leg</h4>
                        <div class="flex flex-col gap-2">
                            ${r.legs && r.legs.length > 0 ? r.legs.map(l => `
                                <div class="bg-slate-800 border border-slate-700 rounded-lg overflow-hidden">
                                    <!-- NOTA: Chiama toggleLeg -->
                                    <div onclick="event.stopPropagation(); toggleLeg(${r.id}, ${l.id})" id="leg-header-${l.id}" class="p-3 cursor-pointer flex justify-between items-center hover:bg-slate-700 transition-colors">
                                        <div>
                                            <h4 class="font-semibold text-slate-200 text-sm">${l.name}</h4>
                                            <div class="text-[10px] text-slate-500 mt-0.5 flex gap-2">
                                                <span>${l.total_stages} Stage</span> &bull; <span>${l.total_km} km</span>
                                            </div>
                                        </div>
                                        <i class="fa-solid fa-chevron-down text-slate-500 transition-transform" id="chevron-leg-${l.id}"></i>
                                    </div>
                                    
                                    <div id="leg-body-${l.id}" class="hidden border-t border-slate-700 p-2 bg-slate-900">
                                        <div id="leg-standings-${l.id}"></div>
                                    </div>
                                </div>
                            `).join('') : `<div class="p-2 text-xs text-slate-500">Nessuna leg.</div>`}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function toggleRally(id) {
            const currentBody = document.getElementById(`rally-body-${id}`);
            const isCurrentlyHidden = currentBody.classList.contains('hidden');

            document.querySelectorAll('[id^="rally-body-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="chevron-rally-"]').forEach(el => el.classList.remove('rotate-180'));

            if (isCurrentlyHidden) {
                currentBody.classList.remove('hidden');
                document.getElementById(`chevron-rally-${id}`).classList.add('rotate-180');

                const pointsContainer = document.getElementById(`rally-points-${id}`);
                if (!pointsContainer.dataset.loaded) {
                    pointsContainer.innerHTML = `<div class="text-xs text-slate-500 animate-pulse"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Caricamento punti...</div>`;
                    try {
                        const res = await apiJson(`/standings/rally/${id}`);
                        pointsContainer.innerHTML = `<h4 class="text-[10px] uppercase text-vrg-accent font-bold mb-1">Classifica Punti Rally</h4>` + renderRallyPointsHTML(res.data);
                        pointsContainer.dataset.loaded = true;
                    } catch (e) {
                        pointsContainer.innerHTML = `<div class="text-red-400 text-xs">Errore: ${e.message}</div>`;
                    }
                }
            }
        }

        // QUESTA È LA FUNZIONE CHE MANCAVA!
        async function toggleLeg(rallyId, legId) {
            const body = document.getElementById(`leg-body-${legId}`);
            const chevron = document.getElementById(`chevron-leg-${legId}`);
            const isCurrentlyHidden = body.classList.contains('hidden');

            document.querySelectorAll('[id^="leg-body-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="chevron-leg-"]').forEach(el => el.classList.remove('rotate-180'));
            document.querySelectorAll('[id^="leg-header-"]').forEach(el => el.classList.remove('border-l-4', 'border-vrg-accent', 'bg-slate-700'));

            if (isCurrentlyHidden) {
                body.classList.remove('hidden');
                chevron.classList.add('rotate-180');
                document.getElementById(`leg-header-${legId}`).classList.add('border-l-4', 'border-vrg-accent', 'bg-slate-700');

                const standingsContainer = document.getElementById(`leg-standings-${legId}`);
                if (!standingsContainer.dataset.loaded) {
                    standingsContainer.innerHTML = `<div class="text-xs text-slate-500 animate-pulse p-2"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Caricamento tempi...</div>`;
                    try {
                        const res = await apiJson(`/standings/leg/${legId}`);
                        standingsContainer.innerHTML = renderLegStandingsHTML(res.data);
                        standingsContainer.dataset.loaded = true;
                    } catch (e) {
                        standingsContainer.innerHTML = `<div class="text-red-400 text-xs p-2">Errore: ${e.message}</div>`;
                    }
                }

                try {
                    if (!state.currentTree || !state.currentTree.rallies) throw new Error("Dati non caricati");
                    const rally = state.currentTree.rallies.find(r => r.id == rallyId);
                    if (!rally) throw new Error("Rally non trovato");
                    const leg = rally.legs.find(l => l.id == legId);
                    if (!leg) throw new Error("Leg non trovata");

                    setLayoutState('leg');
                    document.getElementById('stages-title').innerHTML = `<i class="fa-solid fa-stopwatch text-vrg-accent mr-2"></i> ${leg.name}`;
                    
                    const stageList = document.getElementById('stage-list');
                    if (leg.stages && leg.stages.length > 0) {
                        stageList.innerHTML = leg.stages.map(s => `
                            <div class="bg-vrg-card border border-slate-700 rounded-xl overflow-hidden mb-3">
                                <div onclick="toggleStageResults(${s.id})" class="p-3 cursor-pointer flex justify-between items-center hover:bg-slate-800 transition-colors">
                                    <div>
                                        <h3 class="font-bold text-white text-sm">${s.name}</h3>
                                        <div class="text-[10px] text-slate-400 mt-1 flex gap-3">
                                            ${s.distance_km ? `<span><i class="fa-solid fa-ruler"></i> ${s.distance_km} km</span>` : ''}
                                            <span><i class="fa-solid fa-cloud"></i> ${s.weather || 'Sereno'}</span>
                                        </div>
                                    </div>
                                    <i class="fa-solid fa-chevron-down text-slate-500 transition-transform" id="chevron-stage-${s.id}"></i>
                                </div>
                                <div id="stage-body-${s.id}" class="hidden border-t border-slate-700">
                                    <div id="stage-results-${s.id}" class="p-2 text-center"></div>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        stageList.innerHTML = `<div class="text-slate-500 text-sm text-center py-4">Nessuna stage in questa leg.</div>`;
                    }
                } catch (e) {
                    console.error(e);
                    alert("Errore: " + e.message);
                }
            } else {
                setLayoutState('champ');
            }
        }

        async function toggleStageResults(stageId) {
            const body = document.getElementById(`stage-body-${stageId}`);
            const chevron = document.getElementById(`chevron-stage-${stageId}`);
            const isHidden = body.classList.contains('hidden');
            
            document.querySelectorAll('[id^="stage-body-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="chevron-stage-"]').forEach(el => el.classList.remove('rotate-180'));

            if (isHidden) {
                body.classList.remove('hidden');
                chevron.classList.add('rotate-180');

                const container = document.getElementById(`stage-results-${stageId}`);
                if (container.dataset.loaded) return;
                
                try {
                    const res = await apiJson(`/standings/stage/${stageId}`);
                    container.innerHTML = renderStageResultsHTML(res.data);
                    container.dataset.loaded = true;
                } catch (e) {
                    container.innerHTML = `<div class="text-red-400 text-xs">Errore: ${e.message}</div>`;
                }
            }
        }

        // =========================================================
        // COMPONENTE TABELLA RISULTATI (Per le Stage)
        // =========================================================
        function renderMatrixHTML(data, type) {
            if (!data.drivers || data.drivers.length === 0) return '<div class="text-slate-500 text-xs text-center py-2">Nessun punteggio.</div>';

            const cols = type === 'championship' ? data.rallies : data.legs;
            
            let html = `<div class="overflow-x-auto rounded border border-slate-700 w-full">
                <table class="w-full text-left text-xs table-fixed min-w-max">
                    <thead class="bg-slate-800 text-slate-400 uppercase text-[10px]">
                        <tr>
                            <!-- Colonna Pilota larga fissa -->
                            <th class="px-2 py-2 w-32 truncate">Pilota</th>`;
            
            // Colonne dinamiche strette (w-8 = 32px)
            cols.forEach((c) => {
                html += `<th class="px-1 py-2 text-center w-8" title="${c.name}">R</th>`;
            });
            
            html += `<th class="px-2 py-2 text-right bg-slate-800 font-bold text-vrg-accent w-10">Tot</th>
                    </tr>
                </thead><tbody>`;

            data.drivers.forEach((d, i) => {
                const rowCls = i === 0 ? 'bg-vrg-accent/10' : (i % 2 === 1 ? 'bg-slate-900/50' : '');
                html += `<tr class="border-b border-slate-700/50 hover:bg-slate-800 transition-colors ${rowCls}">
                    <td class="px-2 py-2 font-medium text-white w-32 truncate">${d.driver}</td>`;
                
                cols.forEach(c => {
                    const key = type === 'championship' ? 'rallies' : 'legs';
                    const pts = d[key][c.id] || 0;
                    html += `<td class="px-1 py-2 text-center ${pts > 0 ? 'text-slate-200 font-bold' : 'text-slate-600'}">${pts > 0 ? pts : '-'}</td>`;
                });
                
                html += `<td class="px-2 py-2 text-right font-bold text-vrg-accent">${d.total}</td>
                </tr>`;
            });

            html += `</tbody></table></div>`;
            return html;
        }

        // =========================================================
        // RESET / NAVIGAZIONE INDIETRO (I tasti "X")
        // =========================================================
        function resetToChamp() {
            // Resetta lo stato
            state.currentChamp = null;
            state.currentTree = null;
            state.selectedLeg = null;

            // Toglie l'effetto grigio/attivo da tutte le card
            document.querySelectorAll('.champ-card').forEach(el => {
                el.classList.remove('dimmed', 'active-item');
                // Svuota e nasconde le tabelle dei punteggi
                const matrix = el.querySelector('[id^="champ-matrix-container-"]');
                if (matrix) {
                    matrix.classList.add('hidden');
                    matrix.innerHTML = '';
                }
            });

            // Torna al layout a 1 colonna
            setLayoutState('home');
            
            // Pulisce l'URL
            window.history.pushState({}, '', window.location.pathname);
        }

        function resetToRally() {
            // Resetta la leg selezionata
            state.selectedLeg = null;

            // Toglie l'evidenziazione dalle Leg
            document.querySelectorAll('[id^="leg-item-"]').forEach(el => {
                el.classList.remove('opacity-50', 'bg-slate-800', 'border-l-4', 'border-vrg-accent');
            });

            // Torna al layout a 2 colonne
            setLayoutState('champ');
        }

        // Tabella per i Punti del Rally
        function renderRallyPointsHTML(data) {
            if (!data || data.length === 0) return `<div class="text-xs text-slate-500 p-2">Nessun punteggio.</div>`;
            
            // Aggiunto max-h-64 (circa 8 righe) e overflow-y-auto per lo scroll
            let html = `<div class="border border-slate-700 rounded overflow-hidden mb-3 max-h-64 overflow-y-auto custom-scrollbar">
                        <table class="w-full text-xs text-left"><tbody>`;
            
            data.forEach((s, idx) => {
                html += `<tr class="border-b border-slate-800 bg-slate-900 ${idx===0 ? 'text-vrg-accent font-bold' : 'text-slate-300'}">
                    <td class="px-2 py-1.5 w-8 text-center border-r border-slate-700">${s.position}</td>
                    <td class="px-2 py-1.5">${s.driver}</td>
                    <td class="px-2 py-1.5 text-right w-16">${s.points} pt</td>
                </tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        // Tabella per la Sommatoria Tempi della Leg
        function renderLegStandingsHTML(data) {
            if (!data || data.length === 0) return `<div class="text-xs text-slate-500 p-2">Nessun tempo registrato.</div>`;
            let html = `<div class="border border-slate-700 rounded overflow-hidden mb-2"><table class="w-full text-[11px] text-left"><tbody>`;
            data.forEach((s, idx) => {
                html += `<tr class="border-b border-slate-800 bg-slate-800/50 ${idx===0 ? 'text-white font-bold' : 'text-slate-300'}">
                    <td class="px-2 py-1.5 w-8 text-center border-r border-slate-700">${s.position}</td>
                    <td class="px-2 py-1.5">
                        <div>${s.driver}</div>
                        <div class="text-[9px] text-slate-500">${s.car || '-'}</div>
                    </td>
                    <td class="px-2 py-1.5 text-right font-mono text-vrg-accent">${s.total_str}</td>
                </tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        // Tabella per i risultati della singola Stage
        function renderStageResultsHTML(data) {
            if (!data || data.length === 0) return `<div class="text-xs text-slate-500 py-2 text-center">Nessun risultato ufficiale.</div>`;
            let html = `<div class="overflow-x-auto"><table class="w-full text-left text-[11px]"><thead class="text-[9px] uppercase bg-slate-800 text-slate-400 border-b border-slate-700"><tr><th class="px-2 py-1.5 text-center w-8">Pos</th><th class="px-2 py-1.5">Pilota / Vettura</th><th class="px-2 py-1.5 text-right">Tempo</th></tr></thead><tbody>`;
            data.forEach((row, i) => {
                const rowCls = i === 0 ? 'bg-vrg-accent/10' : (i % 2 === 1 ? 'bg-slate-900/30' : '');
                html += `<tr class="border-b border-slate-700/50 ${rowCls} hover:bg-slate-800 transition-colors">
                    <td class="px-2 py-1.5 text-center font-bold text-white">${row.position}</td>
                    <td class="px-2 py-1.5">
                        <div class="font-medium text-slate-200">${row.driver_name}</div>
                        <div class="text-[9px] text-slate-500">${row.car_model || '-'}</div>
                    </td>
                    <td class="px-2 py-1.5 text-right font-mono text-vrg-accent">${row.time_str}</td>
                </tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }
    </script>
</body>
</html>
