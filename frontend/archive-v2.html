<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivio Campionati - ACR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/v2-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen pb-10">

    <header class="relative bg-[#23211F] shadow-lg border-b-4 border-[#E10600] overflow-hidden h-32 md:h-40">
        
        <!-- Immagine di sfondo (Modificato a center_70%) -->
        <div class="absolute inset-0 bg-[url('assets/backgrounds/vrg_banner.png')] bg-cover bg-[center_70%]"></div>
        
        <!-- Fading ai lati -->
        <div class="absolute inset-0 bg-gradient-to-r from-[#23211F] via-transparent to-[#23211F]"></div>
        
        <!-- Overlay scuro leggero -->
        <div class="absolute inset-0 bg-black/20"></div>

        <div class="relative max-w-[1600px] mx-auto px-4 h-full flex items-center justify-between z-10">
            
            <!-- Logo a sinistra -->
            <div class="flex items-center gap-4">
                <h1 class="text-3xl font-black text-white italic tracking-tighter drop-shadow-lg">
                    ACR <span class="text-[#E10600]">CHAMPIONSHIP</span>
                </h1>
            </div>
            
            <!-- Nav a destra -->
            <nav class="hidden md:flex items-center gap-6 font-racing font-bold text-sm drop-shadow-md">
                <a href="index-v2.html" class="text-white border-b-2 border-[#E10600] pb-1"><i class="fa-solid fa-trophy mr-2 text-[#E10600]"></i>Campionato</a>
                <a href="archive-v2.html" class="text-[#E8E8E8] hover:text-white transition"><i class="fa-solid fa-box-archive mr-2"></i>Archivio</a>
                
                <div class="h-6 w-px bg-white/30 mx-2"></div>

                <div id="header-nav" class="flex items-center gap-4"></div>
            </nav>
        </div>
    </header>

    <main class="max-w-[1200px] mx-auto px-4 mt-8">
        <div class="mb-8">
            <h2 class="text-3xl font-black text-[#2C2A28] mb-2 font-racing">Campionati Passati</h2>
            <p class="text-[#6B665F] font-medium">Seleziona un campionato per visualizzare i risultati completi.</p>
        </div>

        <div id="archive-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-gray-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i>
                <p>Caricamento archivio...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await api.getChampionships();
                const grid = document.getElementById('archive-grid');
                
                if (!res.data || res.data.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Nessun campionato in archivio.</div>`;
                    return;
                }

                grid.innerHTML = res.data.map(c => {
                    const dataCreazione = new Date(c.created_at).toLocaleDateString('it-IT');
                    return `
                        <a href="index-v2.html?id=${c.id}" class="card-wrc block p-6 hover:-translate-y-1 transition-transform cursor-pointer relative overflow-hidden group border-l-4 border-[#E10600]">
                            <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                                <i class="fa-solid fa-trophy text-6xl text-[#23211F]"></i>
                            </div>
                            <h3 class="text-2xl font-black text-[#2C2A28] mb-1 font-racing">${c.name}</h3>
                            <div class="text-sm font-bold text-[#6B665F] mb-4"><i class="fa-regular fa-calendar mr-1"></i> Creato il ${dataCreazione}</div>
                            
                            <div class="inline-block bg-[#23211F] text-white text-xs font-bold px-3 py-1 rounded">
                                Vedi Risultati <i class="fa-solid fa-chevron-right ml-1"></i>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById('archive-grid').innerHTML = `<div class="col-span-full text-center py-12 text-red-500">Errore: ${e.message}</div>`;
            }
        });
    </script>
</body>
</html>
