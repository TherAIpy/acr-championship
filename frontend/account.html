<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mio Profilo - ACR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/v2-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-[#E5E0D8] p-4 flex flex-col items-center pt-12 relative overflow-x-hidden">

    <!-- Sfondo con montagne sfumate -->
    <div class="absolute inset-0 opacity-10 bg-[url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80')] bg-cover bg-center"></div>

    <div class="w-full max-w-4xl relative z-10">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-4xl font-black italic font-racing text-[#2C2A28]">IL MIO PROFILO</h1>
            <a href="index-v2.html" class="bg-[#23211F] text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-[#E10600] transition-colors"><i class="fa-solid fa-arrow-left mr-2"></i>Torna alla Home</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- COLONNA SINISTRA: Dati Anagrafici -->
            <div class="md:col-span-1 card-wrc p-6">
                <div class="text-center mb-6">
                    <div class="w-20 h-20 bg-[#EBE6DC] rounded-full mx-auto flex items-center justify-center border-4 border-[#D1CBBF] mb-3">
                        <i class="fa-solid fa-user text-3xl text-[#6B665F]"></i>
                    </div>
                    <h2 id="profile-name" class="text-2xl font-black font-racing text-[#2C2A28]">...</h2>
                    <button onclick="openEditProfile()" class="mt-2 text-xs font-bold text-[#E10600] hover:text-[#2C2A28] bg-[#F4F1EA] px-3 py-1 rounded border border-[#D1CBBF] transition-colors"><i class="fa-solid fa-pen mr-1"></i> Modifica Dati</button>
                    <p id="profile-ign" class="text-sm font-bold text-[#E10600]">...</p>
                </div>
                
                <div class="space-y-3 text-sm">
                    <div class="border-b border-[#D1CBBF] pb-2">
                        <span class="block text-xs font-bold text-[#6B665F] uppercase">Email</span>
                        <span id="profile-email" class="font-bold text-[#2C2A28]">...</span>
                    </div>
                    <div class="border-b border-[#D1CBBF] pb-2">
                        <span class="block text-xs font-bold text-[#6B665F] uppercase">Ruolo Account</span>
                        <span id="profile-role" class="font-bold text-[#2C2A28] uppercase">...</span>
                    </div>
                </div>
            </div>

            <!-- COLONNA DESTRA: Statistiche -->
            <div class="md:col-span-2 flex flex-col gap-6">
                
                <div class="card-wrc p-6">
                    <h3 class="text-lg font-black font-racing text-[#2C2A28] mb-4 border-b border-[#D1CBBF] pb-2"><i class="fa-solid fa-chart-line text-[#E10600] mr-2"></i>Le tue Statistiche</h3>
                    
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div class="bg-[#EBE6DC] p-4 rounded-xl border border-[#D1CBBF]">
                            <div class="text-3xl font-black font-racing text-[#E10600]" id="stat-champs">0</div>
                            <div class="text-[10px] font-bold text-[#6B665F] uppercase mt-1">Campionati</div>
                        </div>
                        <div class="bg-[#EBE6DC] p-4 rounded-xl border border-[#D1CBBF]">
                            <div class="text-3xl font-black font-racing text-[#E10600]" id="stat-stages">0</div>
                            <div class="text-[10px] font-bold text-[#6B665F] uppercase mt-1">Stage Completate</div>
                        </div>
                        <div class="bg-[#EBE6DC] p-4 rounded-xl border border-[#D1CBBF]">
                            <div class="text-3xl font-black font-racing text-[#E10600]" id="stat-km">0</div>
                            <div class="text-[10px] font-bold text-[#6B665F] uppercase mt-1">Km Percorsi</div>
                        </div>
                    </div>
                </div>

                <!-- Sezione futura per lo storico -->
                <div class="card-wrc p-6 flex-1">
                    <h3 class="text-lg font-black font-racing text-[#2C2A28] mb-4 border-b border-[#D1CBBF] pb-2"><i class="fa-solid fa-list-check text-[#E10600] mr-2"></i>I tuoi Campionati</h3>
                    <div id="user-entries-list" class="text-sm text-[#6B665F]">
                        <i class="fa-solid fa-spinner fa-spin"></i> Caricamento storico...
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- MODALE MODIFICA PROFILO -->
    <div id="modal-edit-profile" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-[#F4F1EA] rounded-xl p-6 w-full max-w-md border border-[#D1CBBF] shadow-2xl relative">
            <h2 class="text-2xl font-black italic font-racing text-[#2C2A28] mb-4">Modifica Profilo</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-[#6B665F] uppercase mb-1">Nome</label>
                    <input type="text" id="edit-first-name" class="w-full bg-white text-[#2C2A28] border border-[#D1CBBF] rounded-lg px-4 py-2 font-bold focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#6B665F] uppercase mb-1">Cognome</label>
                    <input type="text" id="edit-last-name" class="w-full bg-white text-[#2C2A28] border border-[#D1CBBF] rounded-lg px-4 py-2 font-bold focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#6B665F] uppercase mb-1">Nome in Game (IGN)</label>
                    <input type="text" id="edit-ign" class="w-full bg-white text-[#2C2A28] border border-[#D1CBBF] rounded-lg px-4 py-2 font-bold focus:outline-none">
                    <p class="text-[10px] text-[#E10600] mt-1 font-bold"><i class="fa-solid fa-info-circle"></i> La modifica dell'IGN richiede l'approvazione di un Admin.</p>
                </div>
                <div class="pt-2 border-t border-[#D1CBBF]">
                    <label class="block text-xs font-bold text-[#6B665F] uppercase mb-1">Email</label>
                    <input type="email" id="edit-email" class="w-full bg-white text-[#2C2A28] border border-[#D1CBBF] rounded-lg px-4 py-2 font-bold focus:outline-none">
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button onclick="document.getElementById('modal-edit-profile').classList.replace('flex','hidden')" class="px-4 py-2 font-bold text-[#6B665F] hover:text-[#2C2A28]">Annulla</button>
                <button onclick="saveProfile()" class="bg-[#E10600] text-white px-6 py-2 rounded-lg font-bold shadow-md hover:bg-[#b30500]">Salva Modifiche</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>
        <script>
                let userProfileData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const sb = window.supabaseClient || window.supabase;
            const { data: { session } } = await sb.auth.getSession();
            
            if (!session) return window.location.href = 'login.html';

            // 1. Mostra email e ruolo
            document.getElementById('profile-email').textContent = session.user.email;
            document.getElementById('profile-role').textContent = session.user.app_metadata?.role || 'User';

            // 2. Recupera profilo e statistiche
            try {
                const profileRes = await apiJson('/user/profile');
                if (profileRes.success && profileRes.data) {
                    userProfileData = profileRes.data;
                    document.getElementById('profile-name').textContent = `${userProfileData.first_name} ${userProfileData.last_name}`;
                    document.getElementById('profile-ign').textContent = userProfileData.ign || 'Nessun IGN';
                }

                const statsRes = await apiJson(`/user/${session.user.id}/stats`);
                if (statsRes.success) {
                    document.getElementById('stat-champs').textContent = statsRes.data.total_championships || 0;
                    document.getElementById('stat-stages').textContent = statsRes.data.total_stages || 0;
                    document.getElementById('stat-km').textContent = statsRes.data.total_km || 0;
                }

                // Carica storico iscrizioni
                const entriesRes = await apiJson(`/user/${session.user.id}/entries`);
                const list = document.getElementById('user-entries-list');
                const entries = entriesRes.data || [];
                if (entries.length === 0) {
                    list.innerHTML = `<div class="text-center py-4 bg-[#EBE6DC] rounded border border-[#D1CBBF]">Non sei iscritto a nessun campionato.</div>`;
                } else {
                    list.innerHTML = entries.map(e => {
                        const champName = e.championship ? e.championship.name : 'Sconosciuto';
                        const carName = e.car ? `${e.car.brand} ${e.car.name}` : 'Auto non specificata';
                        return `
                            <div class="flex justify-between items-center p-3 mb-2 bg-[#EBE6DC] rounded-lg border border-[#D1CBBF]">
                                <div>
                                    <div class="font-bold text-[#2C2A28] font-racing text-lg">${champName}</div>
                                    <div class="text-xs text-[#6B665F] font-bold"><i class="fa-solid fa-car mr-1"></i> ${carName}</div>
                                </div>
                                ${e.is_disqualified ? '<span class="text-xs font-bold text-red-600 bg-red-100 px-2 py-1 rounded">Squalificato</span>' : '<span class="text-xs font-bold text-green-600 bg-green-100 px-2 py-1 rounded">Regolare</span>'}
                            </div>`;
                    }).join('');
                }
            } catch (e) { console.error(e); }
        });

        function openEditProfile() {
            if (!userProfileData) return alert("Dati non ancora caricati.");
            
            const sb = window.supabaseClient || window.supabase;
            sb.auth.getSession().then(({data}) => {
                document.getElementById('edit-email').value = data.session.user.email;
            });

            document.getElementById('edit-first-name').value = userProfileData.first_name || '';
            document.getElementById('edit-last-name').value = userProfileData.last_name || '';
            document.getElementById('edit-ign').value = userProfileData.ign || '';
            
            document.getElementById('modal-edit-profile').classList.replace('hidden', 'flex');
        }

        async function saveProfile() {
            const sb = window.supabaseClient || window.supabase;
            const { data: { session } } = await sb.auth.getSession();
            
            const newEmail = document.getElementById('edit-email').value.trim();
            const payload = {
                first_name: document.getElementById('edit-first-name').value.trim(),
                last_name: document.getElementById('edit-last-name').value.trim(),
                ign: document.getElementById('edit-ign').value.trim()
            };

            try {
                const res = await apiJson('/user/profile', {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                });

                if (!res.success) throw new Error(res.error);

                if (newEmail !== session.user.email) {
                    const { error } = await sb.auth.updateUser({ email: newEmail });
                    if (error) throw error;
                    alert("Ti è stata inviata una mail per confermare il nuovo indirizzo.");
                }

                alert("Dati salvati! Se hai cambiato l'IGN, attendi l'approvazione di un admin.");
                document.getElementById('modal-edit-profile').classList.replace('flex','hidden');
                window.location.reload();

            } catch (e) {
                alert("Errore: " + e.message);
            }
        }
    </script>
</body>
</html>
