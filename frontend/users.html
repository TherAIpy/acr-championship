<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Utenti - ACR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { vrg: { bg: '#0B1120', sidebar: '#0F172A', card: '#1E293B', accent: '#EAB308', text: '#94A3B8', textlight: '#F1F5F9' } } } } }
    </script>
</head>
<body class="bg-vrg-bg text-vrg-text font-sans h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-vrg-sidebar border-r border-slate-800 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="p-6 flex items-center gap-3">
                <div class="text-vrg-accent text-2xl font-bold italic tracking-tighter">VRG</div>
            </div>
            <nav class="mt-4 px-3 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-trophy w-5"></i> Campionati
                </a>
                <!-- NUOVO LINK -->
                <a href="users.html" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg bg-slate-800 text-white border-l-4 border-vrg-accent">
                    <i class="fa-solid fa-users w-5 text-vrg-accent"></i> Gestione Utenti
                </a>
            </nav>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-20 bg-vrg-bg border-b border-slate-800 flex items-center justify-between px-8 shrink-0">
            <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-users text-vrg-accent"></i> Piloti Registrati
            </h1>
            <div class="flex items-center gap-4">
                <a href="index-v2.html" target="_blank" class="text-sm text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-external-link-alt mr-1"></i> Vai al sito</a>
                <button onclick="supabase.auth.signOut().then(()=>window.location.href='login.html')" class="text-slate-400 hover:text-red-400 transition-colors"><i class="fa-solid fa-power-off text-lg"></i></button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 flex justify-center">
            <div class="w-full max-w-6xl">
                <div class="bg-vrg-card rounded-xl border border-slate-700 overflow-hidden shadow-lg">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="text-xs uppercase bg-slate-800/50 text-slate-400 border-b border-slate-700">
                            <tr>
                                <th class="px-6 py-4 font-semibold">Pilota</th>
                                <th class="px-6 py-4 font-semibold">IGN</th>
                                <th class="px-6 py-4 font-semibold">Email</th>
                                <th class="px-6 py-4 font-semibold text-center">Campionati</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody" class="divide-y divide-slate-700/50">
                            <tr><td colspan="4" class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Caricamento utenti...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session || session.user.app_metadata?.role !== 'admin') {
                window.location.href = '/';
                return;
            }

            try {
                const res = await apiJson('/users');
                const tbody = document.getElementById('users-tbody');
                
                if (!res.data || res.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-500">Nessun utente registrato.</td></tr>`;
                    return;
                }

                tbody.innerHTML = res.data.map(u => `
                    <tr class="hover:bg-slate-800/30 transition-colors">
                        <td class="px-6 py-4 font-bold text-white">${u.first_name} ${u.last_name}</td>
                        <td class="px-6 py-4 text-vrg-accent">${u.ign || '-'}</td>
                        <td class="px-6 py-4 text-slate-400">${u.email}</td>
                        <td class="px-6 py-4 text-center font-bold">
                            <span class="bg-slate-700 px-3 py-1 rounded-full text-xs">${u.entries_count}</span>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                document.getElementById('users-tbody').innerHTML = `<tr><td colspan="4" class="text-center py-8 text-red-400">Errore: ${e.message}</td></tr>`;
            }
        });
    </script>
</body>
</html>
