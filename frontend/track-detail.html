<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Tracciato - ACR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/v2-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen pb-10">

    <!-- HEADER -->
    <header class="bg-[#23211F] text-white shadow-lg border-b-4 border-[#E10600]">
        <div class="max-w-[1200px] mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-black text-white italic tracking-tighter">ACR <span class="text-[#E10600]">TRACK LEADERBOARD</span></h1>
            </div>
            <button onclick="window.close()" class="text-[#A8A29A] hover:text-white transition font-racing font-bold text-sm">
                <i class="fa-solid fa-xmark mr-2"></i>Chiudi Scheda
            </button>
        </div>
    </header>

    <main class="max-w-[1400px] mx-auto px-4 mt-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- COLONNA SINISTRA: INFO TECNICHE -->
            <div class="lg:col-span-1">
                <div class="card-wrc p-6 sticky top-6">
                    <div class="text-center mb-6 border-b border-[#D1CBBF] pb-4">
                        <div id="track-country-badge" class="inline-block bg-[#E10600] text-white text-[10px] font-bold px-3 py-1 rounded shadow-sm uppercase tracking-widest mb-2">N/D</div>
                        <h1 id="track-title" class="text-4xl font-black font-racing italic text-[#2C2A28] leading-none mb-1">Caricamento...</h1>
                        <h2 id="track-location" class="text-sm text-[#6B665F] font-bold uppercase tracking-widest"></h2>
                    </div>

                    <h3 class="text-xs font-bold text-[#2C2A28] uppercase tracking-wider mb-4"><i class="fa-solid fa-list-check text-[#E10600] mr-2"></i> Scheda Tecnica</h3>
                    
                    <!-- Griglia a 2 colonne -->
                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <div class="bg-[#EBE6DC] p-3 rounded-lg border border-[#D1CBBF]">
                            <div class="text-[10px] font-bold text-[#6B665F] uppercase mb-1">Lunghezza</div>
                            <div id="info-length" class="text-lg font-black text-[#2C2A28]">-</div>
                        </div>
                        <div class="bg-[#EBE6DC] p-3 rounded-lg border border-[#D1CBBF]">
                            <div class="text-[10px] font-bold text-[#6B665F] uppercase mb-1">Settori</div>
                            <div id="info-sectors" class="text-lg font-black text-[#2C2A28]">-</div>
                        </div>
                        <div class="bg-[#EBE6DC] p-3 rounded-lg border border-[#D1CBBF]">
                            <div class="text-[10px] font-bold text-[#6B665F] uppercase mb-1">Alt. Min</div>
                            <div id="info-alt-min" class="text-sm font-black text-[#2C2A28]">-</div>
                        </div>
                        <div class="bg-[#EBE6DC] p-3 rounded-lg border border-[#D1CBBF]">
                            <div class="text-[10px] font-bold text-[#6B665F] uppercase mb-1">Alt. Max</div>
                            <div id="info-alt-max" class="text-sm font-black text-[#2C2A28]">-</div>
                        </div>
                    </div>

                    <ul class="space-y-3 text-sm font-bold text-[#2C2A28] mb-6">
                        <li class="flex justify-between items-center border-b border-[#F3F4F6] pb-2">
                            <span class="text-[#6B665F] flex items-center gap-2"><i class="fa-solid fa-road w-4 text-center"></i> Superficie</span> 
                            <span id="info-surface">-</span>
                        </li>
                        <li class="flex justify-between items-center border-b border-[#F3F4F6] pb-2">
                            <span class="text-[#6B665F] flex items-center gap-2"><i class="fa-solid fa-ruler-horizontal w-4 text-center"></i> Larghezza</span> 
                            <span id="info-width">-</span>
                        </li>
                        <li class="flex justify-between items-center pb-2">
                            <span class="text-[#6B665F] flex items-center gap-2"><i class="fa-solid fa-fire w-4 text-center"></i> Difficoltà</span> 
                            <span id="info-difficulty" class="px-2 py-0.5 rounded text-xs bg-gray-200">-</span>
                        </li>
                    </ul>

                    <!-- Box Difficoltà visiva -->
                    <div id="difficulty-bar-container" class="hidden">
                        <div class="flex justify-between text-[10px] font-bold text-[#6B665F] uppercase mb-1">
                            <span>Facile</span>
                            <span>Media</span>
                            <span>Difficile</span>
                        </div>
                        <div class="w-full bg-gray-300 h-2 rounded-full overflow-hidden">
                            <div id="difficulty-bar" class="h-full bg-[#E10600] transition-all duration-500" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLONNA DESTRA: LEADERBOARD -->
            <div class="lg:col-span-2">
                <div class="card-wrc overflow-hidden">
                    <div class="bg-[#1E2532] text-white p-4 flex justify-between items-center">
                        <h2 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-stopwatch text-[#E10600]"></i> Leaderboard Assoluta</h2>
                    </div>
                    
                    <div class="max-h-[700px] overflow-y-auto custom-scrollbar">
                        <table class="w-full table-wrc text-sm">
                            <thead class="sticky top-0 z-10">
                                <tr>
                                    <th class="w-12 text-center">Pos</th>
                                    <th>Pilota</th>
                                    <th>Vettura</th>
                                    <th class="text-right">Tempo</th>
                                    <th class="text-center">Condizioni</th>
                                </tr>
                            </thead>
                            <tbody id="track-results-tbody">
                                <tr><td colspan="5" class="text-center py-8"><i class="fa-solid fa-spinner fa-spin"></i></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const trackId = urlParams.get('id');
        let allResults = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (!trackId) {
                document.getElementById('track-header-container').innerHTML = `<div class="text-red-500 text-center">ID Tracciato non fornito.</div>`;
                return;
            }

            try {
                const res = await apiJson(`/track-results/${trackId}`);
                allResults = res.data || [];
                
                if (res.track_info) {
                    const t = res.track_info;
                    
                    // Funzione di supporto per aggiornare il testo in sicurezza
                    const setText = (id, text) => {
                        const el = document.getElementById(id);
                        if (el) el.textContent = text;
                    };

                    setText('track-title', t.name || 'Sconosciuto');
                    setText('track-location', t.location || '');
                    setText('track-country-badge', t.country || 'N/D');
                    
                    setText('info-length', t.length_km ? `${t.length_km} km` : '-');
                    setText('info-sectors', t.sectors || '-');
                    setText('info-alt-min', t.min_altitude ? `${t.min_altitude} m` : '-');
                    setText('info-alt-max', t.max_altitude ? `${t.max_altitude} m` : '-');
                    
                    if (t.surface_gravel_percent > 0 && t.surface_asphalt_percent > 0) {
                        setText('info-surface', `Misto (${t.surface_gravel_percent}% St / ${t.surface_asphalt_percent}% As)`);
                    } else {
                        setText('info-surface', t.surface || '-');
                    }

                    setText('info-width', t.road_width ? `${t.road_width} m` : '-');
                    
                    const diffEl = document.getElementById('info-difficulty');
                    if (diffEl) {
                        diffEl.textContent = t.difficulty || '-';
                        if (t.difficulty === 'Facile') diffEl.className = 'px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-green-100 text-green-700';
                        else if (t.difficulty === 'Media') diffEl.className = 'px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-yellow-100 text-yellow-700';
                        else if (t.difficulty === 'Difficile') diffEl.className = 'px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-red-100 text-red-700';
                    }

                    const barContainer = document.getElementById('difficulty-bar-container');
                    const bar = document.getElementById('difficulty-bar');
                    if (t.difficulty && barContainer && bar) {
                        barContainer.classList.remove('hidden');
                        let percent = 50;
                        if (t.difficulty === 'Facile') percent = 25;
                        if (t.difficulty === 'Difficile') percent = 85;
                        bar.style.width = `${percent}%`;
                    }
                }
                
                // Chiamata alla funzione che genera la tabella dei tempi
                renderLeaderboard(allResults);

            } catch (e) {
                console.error("Errore generale:", e);
                const tbody = document.getElementById('track-results-tbody');
                if (tbody) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-red-500 p-4">Errore: ${e.message}</td></tr>`;
                }
            }
        });

        function getWeatherIcon(weather) {
            if (!weather) return 'fa-sun text-[#EAB308]';
            const w = weather.toLowerCase();
            if (w.includes('pioggia intensa') || w.includes('temporale')) return 'fa-cloud-showers-heavy text-blue-500';
            if (w.includes('pioggia')) return 'fa-cloud-rain text-blue-400';
            if (w.includes('neve')) return 'fa-snowflake text-white';
            if (w.includes('nuvoloso')) return 'fa-cloud text-gray-400';
            return 'fa-sun text-[#EAB308]';
        }

        function getSurfaceIcon(surface) {
            if (!surface) return 'fa-road text-[#2C2A28]';
            const s = surface.toLowerCase();
            if (s.includes('bagnato')) return 'fa-droplet text-blue-400';
            if (s.includes('ghiaccio')) return 'fa-icicles text-cyan-400';
            if (s.includes('neve')) return 'fa-snowflake text-white';
            if (s.includes('sterrato') || s.includes('fango')) return 'fa-mountain text-[#8B5A2B]';
            return 'fa-road text-[#2C2A28]';
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('track-results-tbody');
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-500">Nessun tempo registrato su questo tracciato.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((r, i) => `
                <tr class="${i === 0 ? 'row-first' : ''}">
                    <td class="text-center font-bold">${i + 1}</td>
                    <td>${r.driver_name}</td>
                    <td class="text-xs font-semibold text-[#6B665F]">${r.car_model}</td>
                    <td class="text-right font-mono font-bold text-[#E10600]">${r.time_str}</td>
                    <td class="text-center">
                        <div class="flex justify-center gap-2 text-xs font-bold">
                            <span title="${r.weather}"><i class="fa-solid ${getWeatherIcon(r.weather)}"></i></span>
                            <span title="${r.surface}"><i class="fa-solid ${getSurfaceIcon(r.surface)}"></i></span>
                            <span title="Temperatura">${r.temperature}°C</span>
                        </div>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
