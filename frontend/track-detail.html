<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Tracciato - ACR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/v2-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen pb-10">

    <!-- HEADER -->
    <header class="bg-[#23211F] text-white shadow-lg border-b-4 border-[#E10600]">
        <div class="max-w-[1200px] mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-black text-white italic tracking-tighter">ACR <span class="text-[#E10600]">TRACK LEADERBOARD</span></h1>
            </div>
            <button onclick="window.close()" class="text-[#A8A29A] hover:text-white transition font-racing font-bold text-sm">
                <i class="fa-solid fa-xmark mr-2"></i>Chiudi Scheda
            </button>
        </div>
    </header>

    <main class="max-w-[1200px] mx-auto px-4 mt-8">
        <div id="track-header-container" class="mb-6">
            <div class="text-center py-10 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i><p>Caricamento dati tracciato...</p></div>
        </div>

        <div class="card-wrc overflow-hidden">
            <div class="bg-[#1E2532] text-white p-3 flex justify-between items-center">
                <h2 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-stopwatch text-[#E10600]"></i> Migliori Tempi Assoluti (Tutti i Campionati)</h2>
            </div>
            
            <div class="max-h-[600px] overflow-y-auto custom-scrollbar">
                <table class="w-full table-wrc text-sm">
                    <thead class="sticky top-0 z-10">
                        <tr>
                            <th class="w-12 text-center">Pos</th>
                            <th>Pilota</th>
                            <th>Vettura</th>
                            <th class="text-right">Tempo</th>
                            <th class="text-center">Condizioni</th>
                        </tr>
                    </thead>
                    <tbody id="track-results-tbody">
                        <tr><td colspan="5" class="text-center py-8"><i class="fa-solid fa-spinner fa-spin"></i></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const trackId = urlParams.get('id');
        let allResults = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (!trackId) {
                document.getElementById('track-header-container').innerHTML = `<div class="text-red-500 text-center">ID Tracciato non fornito.</div>`;
                return;
            }

            try {
                const res = await apiJson(`/track-results/${trackId}`);
                allResults = res.data || [];
                
                if (res.track_info) {
                    document.getElementById('track-header-container').innerHTML = `
                        <div class="bg-[#F4F1EA] border border-[#D1CBBF] rounded-lg p-6 shadow-sm flex items-center justify-between">
                            <div>
                                <h1 class="text-4xl font-black font-racing italic text-[#2C2A28]">
                                    ${res.track_info.name} 
                                    <span class="text-xl text-[#6B665F] font-bold not-italic">(${res.track_info.location})</span>
                                </h1>
                                <p class="text-[#6B665F] font-bold text-sm mt-1"><i class="fa-solid fa-route mr-1"></i> Lunghezza: ${res.track_info.length_km || '-'} km</p>
                            </div>
                        </div>
                    `;
                }
                renderLeaderboard(allResults);
            } catch (e) {
                document.getElementById('track-results-tbody').innerHTML = `<tr><td colspan="5" class="text-center text-red-500 p-4">Errore: ${e.message}</td></tr>`;
            }
        });

        function getWeatherIcon(weather) {
            if (!weather) return 'fa-sun text-[#EAB308]';
            const w = weather.toLowerCase();
            if (w.includes('pioggia intensa') || w.includes('temporale')) return 'fa-cloud-showers-heavy text-blue-500';
            if (w.includes('pioggia')) return 'fa-cloud-rain text-blue-400';
            if (w.includes('neve')) return 'fa-snowflake text-white';
            if (w.includes('nuvoloso')) return 'fa-cloud text-gray-400';
            return 'fa-sun text-[#EAB308]';
        }

        function getSurfaceIcon(surface) {
            if (!surface) return 'fa-road text-[#2C2A28]';
            const s = surface.toLowerCase();
            if (s.includes('bagnato')) return 'fa-droplet text-blue-400';
            if (s.includes('ghiaccio')) return 'fa-icicles text-cyan-400';
            if (s.includes('neve')) return 'fa-snowflake text-white';
            if (s.includes('sterrato') || s.includes('fango')) return 'fa-mountain text-[#8B5A2B]';
            return 'fa-road text-[#2C2A28]';
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('track-results-tbody');
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-500">Nessun tempo registrato su questo tracciato.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((r, i) => `
                <tr class="${i === 0 ? 'row-first' : ''}">
                    <td class="text-center font-bold">${i + 1}</td>
                    <td>${r.driver_name}</td>
                    <td class="text-xs font-semibold text-[#6B665F]">${r.car_model}</td>
                    <td class="text-right font-mono font-bold text-[#E10600]">${r.time_str}</td>
                    <td class="text-center">
                        <div class="flex justify-center gap-2 text-xs font-bold">
                            <span title="${r.weather}"><i class="fa-solid ${getWeatherIcon(r.weather)}"></i></span>
                            <span title="${r.surface}"><i class="fa-solid ${getSurfaceIcon(r.surface)}"></i></span>
                            <span title="Temperatura">${r.temperature}°C</span>
                        </div>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
