<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACR Championship V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/v2-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen pb-10">

    <!-- HEADER -->
    <header class="bg-[#23211F] text-white shadow-lg relative overflow-hidden border-b-4 border-[#E10600]">
        <div class="absolute inset-0 opacity-30 bg-[url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80')] bg-cover bg-center mix-blend-luminosity"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-[#23211F] via-transparent to-[#23211F] opacity-80"></div>
        
        <div class="relative max-w-[1600px] mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <h1 class="text-3xl font-black text-white italic tracking-tighter">ACR <span class="text-[#E10600]">CHAMPIONSHIP</span></h1>
            </div>
            
            <nav class="hidden md:flex items-center gap-6 font-racing font-bold text-sm">
                <a href="#" class="text-white border-b-2 border-[#E10600] pb-1"><i class="fa-solid fa-trophy mr-2"></i>Campionato</a>
                <a href="archive-v2.html" class="text-[#A8A29A] hover:text-white transition"><i class="fa-solid fa-box-archive mr-2"></i>Archivio</a>
                <a href="index.html" class="text-[#A8A29A] hover:text-white transition"><i class="fa-solid fa-ranking-star mr-2"></i>Torna alla V1</a>
            </nav>
        </div>
    </header>

    <!-- MAIN GRID -->
    <main class="max-w-[1600px] mx-auto px-4 mt-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- COLONNA SINISTRA: CLASSIFICA CAMPIONATO -->
            <div class="lg:col-span-3 card-wrc overflow-hidden h-fit sticky top-6">
                <div class="bg-[#23211F] text-white p-3 flex justify-between items-center">
                    <h2 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-trophy text-[#E10600]"></i> Classifica</h2>
                </div>
                    <div id="left-col-title" class="p-3 border-b border-[#D1CBBF] bg-[#EBE6DC] text-lg font-bold text-[#2C2A28] text-center font-racing">
                    Caricamento...
                </div>
                <table class="w-full table-wrc text-sm">
                    <thead>
                        <tr>
                            <th class="w-10 text-center">Pos</th>
                            <th>Pilota</th>
                            <th class="w-10 text-center">Cls</th>
                            <th class="w-12 text-right">Punti</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-champ-standings">
                        <tr><td colspan="4" class="text-center py-4 text-gray-500"><i class="fa-solid fa-spinner fa-spin"></i></td></tr>
                    </tbody>
                </table>
            </div>

            <!-- COLONNA CENTRALE: RALLY E LEG -->
            <div class="lg:col-span-4 flex flex-col gap-4">
                <div id="middle-col-container">
                    <div class="card-wrc p-8 text-center text-gray-500">
                        <i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i>
                        <p>Caricamento Rally in corso...</p>
                    </div>
                </div>
            </div>

            <!-- COLONNA DESTRA: STAGE / RISULTATI -->
            <div class="lg:col-span-5 flex flex-col gap-4">
                <div id="right-col-container">
                    <div class="card-wrc p-12 text-center text-gray-500 h-full flex flex-col justify-center items-center min-h-[400px]">
                        <i class="fa-solid fa-mouse-pointer text-4xl mb-4 opacity-50"></i>
                        <p>Seleziona una Leg dalla colonna centrale<br>per visualizzare i tempi.</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- API & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>

    <script>
        const v2State = { champ: null, tree: null, selectedLegId: null };

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await api.getChampionships();
                if (!res.data || res.data.length === 0) {
                    document.getElementById('left-col-title').textContent = "Nessun campionato";
                    return;
                }
                
                // Controlla se c'è un ID nell'URL (es. ?id=6)
                const urlParams = new URLSearchParams(window.location.search);
                const urlId = urlParams.get('id');
                
                if (urlId) {
                    v2State.champ = res.data.find(c => c.id == urlId) || res.data[0];
                } else {
                    v2State.champ = res.data[0]; // Prende il più recente
                }

                document.getElementById('left-col-title').textContent = v2State.champ.name;
                await loadTreeAndStandings();
                
            } catch (e) { console.error("Errore V2:", e); }
        });

        async function loadTreeAndStandings() {
            try {
                const standRes = await apiJson(`/standings/championship/${v2State.champ.id}`);
                renderChampionshipStandings(standRes.data);
            } catch (e) { console.error("Errore classifica", e); }

            try {
                const treeRes = await apiJson(`/tree/${v2State.champ.id}`);
                v2State.tree = treeRes.data;
                renderRallies();
            } catch (e) { console.error("Errore albero", e); }
        }

        async function loadTreeAndStandings() {
            // Carica Classifica Campionato (Colonna Sinistra)
            try {
                const standRes = await apiJson(`/standings/championship/${v2State.champ.id}`);
                renderChampionshipStandings(standRes.data);
            } catch (e) { console.error("Errore classifica", e); }

            // Carica Albero (Colonna Centrale)
            try {
                const treeRes = await apiJson(`/tree/${v2State.champ.id}`);
                v2State.tree = treeRes.data;
                renderRallies();
            } catch (e) { console.error("Errore albero", e); }
        }

        function renderChampionshipStandings(data) {
            const tbody = document.getElementById('tbody-champ-standings');
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4">Nessun punto.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((r, i) => `
                <tr class="${i === 0 ? 'row-first' : ''}">
                    <td class="text-center">${r.position}</td>
                    <td class="flex items-center gap-2">
                        <span class="text-lg">🇮🇹</span> ${r.driver}
                    </td>
                    <td class="text-center"><span class="bg-[#23211F] text-white text-[10px] px-1 rounded">R5</span></td>
                    <td class="text-right font-bold">${r.points}</td>
                </tr>
            `).join('');
        }

        function renderRallies() {
            const container = document.getElementById('middle-col-container');
            if (!v2State.tree.rallies || v2State.tree.rallies.length === 0) {
                container.innerHTML = `<div class="card-wrc p-4 text-center">Nessun rally presente.</div>`;
                return;
            }

            container.innerHTML = v2State.tree.rallies.map(rally => `
                <div class="card-wrc overflow-hidden mb-4">
                    <div class="p-4 border-b border-[#D1CBBF] flex justify-between items-start bg-[#F4F1EA]">
                        <div>
                            <h2 class="text-3xl font-black italic mb-1 text-[#2C2A28]">${rally.name}</h2>
                            <div class="flex gap-4 mt-2 text-xs font-semibold text-[#6B665F]">
                                <span><i class="fa-solid fa-road mr-1"></i> ${rally.total_legs} Leg</span>
                                <span><i class="fa-solid fa-stopwatch mr-1"></i> ${rally.total_stages} Stage</span>
                            </div>
                        </div>
                        <span class="${rally.is_completed ? 'bg-[#4D7C0F]' : 'bg-[#EAB308]'} text-white text-xs font-bold px-2 py-1 rounded shadow-sm">
                            ${rally.is_completed ? 'CONCLUSO' : 'IN CORSO'}
                        </span>
                    </div>
                    
                    <div class="flex flex-col">
                        ${rally.legs && rally.legs.length > 0 ? rally.legs.map(leg => `
                            <div onclick="selectLeg(${leg.id})" class="bg-[#EBE6DC] p-3 border-b border-[#D1CBBF] cursor-pointer hover:bg-[#D1CBBF] transition-colors flex justify-between items-center group">
                                <span class="font-bold text-[#2C2A28] font-racing text-lg">${leg.name}</span>
                                <i class="fa-solid fa-chevron-right text-gray-400 group-hover:text-[#E10600]"></i>
                            </div>
                        `).join('') : '<div class="p-3 text-sm text-gray-500">Nessuna Leg.</div>'}
                    </div>
                </div>
            `).join('');
        }

        async function selectLeg(legId) {
            v2State.selectedLegId = legId;
            const container = document.getElementById('right-col-container');
            container.innerHTML = `<div class="card-wrc p-12 text-center"><i class="fa-solid fa-spinner fa-spin text-3xl text-[#E10600] mb-4"></i><p>Caricamento tempi...</p></div>`;

            try {
                const res = await apiJson(`/standings/leg/${legId}`);
                renderLegResults(res.data, legId);
            } catch (e) {
                container.innerHTML = `<div class="card-wrc p-4 text-red-500">Errore: ${e.message}</div>`;
            }
        }

        function renderLegResults(data, legId) {
            const container = document.getElementById('right-col-container');
            
            // Trova il nome della leg per il titolo
            let legName = "Leg";
            for (const r of v2State.tree.rallies) {
                const l = r.legs.find(x => x.id === legId);
                if (l) { legName = l.name; break; }
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="card-wrc p-8 text-center text-gray-500">Nessun tempo registrato per questa Leg.</div>`;
                return;
            }

            // Calcolo distacchi lato client
            const leaderTimeMs = data[0].total_ms;

            let rowsHtml = data.map((r, i) => {
                // Gap dal primo
                const gapToFirstMs = r.total_ms - leaderTimeMs;
                const gapToFirstStr = gapToFirstMs === 0 ? '-' : `+${(gapToFirstMs/1000).toFixed(2)}`;
                
                // Gap dal precedente
                let gapToPrevStr = '-';
                if (i > 0) {
                    const prevMs = data[i-1].total_ms;
                    const gapToPrevMs = r.total_ms - prevMs;
                    gapToPrevStr = `+${(gapToPrevMs/1000).toFixed(2)}`;
                }

                return `
                    <tr class="${i === 0 ? 'row-first' : ''}">
                        <td class="text-center">${r.position}</td>
                        <td class="flex items-center gap-2">
                            <span class="text-lg">🇮🇹</span> ${r.driver}
                        </td>
                        <td class="text-xs font-semibold text-[#6B665F]">R5 / Auto</td>
                        <td class="text-right font-mono font-bold">${r.total_str}</td>
                        <td class="text-right text-[#E10600]">${gapToPrevStr}</td>
                        <td class="text-right text-[#E10600]">${gapToFirstStr}</td>
                    </tr>
                `;
            }).join('');

            container.innerHTML = `
                <div class="card-wrc overflow-hidden relative">
                    <div class="absolute top-0 right-0 bg-[#23211F] text-white px-6 py-3 rounded-bl-xl text-right z-10 shadow-lg border-b-2 border-l-2 border-[#D1CBBF]">
                        <div class="text-[10px] uppercase text-[#A8A29A] font-bold tracking-wider">Tempo Vincente</div>
                        <div class="text-3xl font-black text-[#EAB308] font-mono leading-none">${data[0].total_str}</div>
                    </div>

                    <div class="p-4 border-b border-[#D1CBBF] bg-[#F4F1EA]">
                        <h2 class="text-3xl font-black italic mb-2 flex items-center gap-2 text-[#2C2A28]"><i class="fa-solid fa-stopwatch"></i> ${legName}</h2>
                    </div>
                    
                    <table class="w-full table-wrc text-sm">
                        <thead>
                            <tr>
                                <th class="w-10 text-center">Pos</th>
                                <th>Pilota</th>
                                <th>Cl. / Vettura</th>
                                <th class="text-right">Tempo</th>
                                <th class="text-right text-[#E10600]">Dist. Prec.</th>
                                <th class="text-right text-[#A8A29A]">Dist. 1°</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>
            `;
        }
    </script>
</body>
</html>
