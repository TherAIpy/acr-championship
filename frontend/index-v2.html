<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACR Championship V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/v2-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen pb-10">

    <!-- HEADER -->
    <header class="bg-[#23211F] text-white shadow-lg relative overflow-hidden border-b-4 border-[#E10600]">
        <div class="relative max-w-[1600px] mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <h1 class="text-3xl font-black text-white italic tracking-tighter">ACR <span class="text-[#E10600]">CHAMPIONSHIP</span></h1>
            </div>
            <nav class="hidden md:flex items-center gap-6 font-racing font-bold text-sm">
                <a href="index-v2.html" class="text-white border-b-2 border-[#E10600] pb-1"><i class="fa-solid fa-trophy mr-2"></i>Campionato</a>
                <a href="archive-v2.html" class="text-[#A8A29A] hover:text-white transition"><i class="fa-solid fa-box-archive mr-2"></i>Archivio</a>
            </nav>
        </div>
    </header>

    <!-- MAIN GRID -->
    <main class="max-w-[1600px] mx-auto px-4 mt-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- COLONNA SINISTRA: CLASSIFICA GENERALE CAMPIONATO -->
            <div class="lg:col-span-4 card-wrc overflow-hidden h-fit sticky top-6">
                <div class="bg-[#23211F] text-white p-3 flex justify-between items-center">
                    <h2 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-trophy text-[#E10600]"></i> Classifica Generale</h2>
                </div>
                <div id="left-col-title" class="p-3 border-b border-[#D1CBBF] bg-[#EBE6DC] text-lg font-bold text-[#2C2A28] text-center font-racing">
                    Caricamento...
                </div>
                <div class="w-full overflow-x-auto">
                    <table class="w-full table-wrc text-xs whitespace-nowrap">
                        <thead class="sticky top-0">
                            <tr id="champ-standings-thead">
                                <th class="w-8 text-center">Pos</th>
                                <th>Pilota / Vettura</th>
                                <th class="text-center">Cls</th>
                                <!-- Le colonne dei rally vengono generate qui -->
                                <th class="text-right">Tot</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-champ-standings">
                            <tr><td colspan="5" class="text-center py-4"><i class="fa-solid fa-spinner fa-spin"></i></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- COLONNA CENTRALE: RALLY, LEG E CLASSIFICHE -->
            <div class="lg:col-span-4 flex flex-col gap-4">
                
                <!-- Blocco Unico: Tab Rally + Leg -->
                <div class="card-wrc overflow-hidden flex flex-col mb-4">
                    <!-- Tab dei Rally -->
                    <div id="rally-tabs-container" class="flex overflow-x-auto bg-[#D1CBBF] custom-scrollbar">
                        <!-- Popolato via JS -->
                    </div>
                    <!-- Lista Leg -->
                    <div id="legs-container" class="flex flex-col">
                        <!-- Popolato via JS -->
                    </div>
                </div>

                <!-- 3. Classifica Leg (Dark) - Nascosta se non c'è leg selezionata -->
                <div id="leg-standings-container" class="hidden">
                    <!-- Header Blu Racing -->
                    <div class="bg-[#1E3A8A] text-white p-3 rounded-t-lg border-b border-[#3D3833] flex justify-between items-center">
                        <h3 class="text-sm font-bold flex items-center gap-2"><i class="fa-solid fa-stopwatch text-[#60A5FA]"></i> Classifica Leg</h3>
                    </div>
                    <div class="bg-[#2C2A28] text-white max-h-[250px] overflow-y-auto custom-scrollbar border-t-0 border border-[#3D3833] rounded-b-lg">
                        <table class="w-full text-xs text-left">
                            <thead class="bg-[#1E3A8A] text-blue-200 uppercase sticky top-0">
                                <tr>
                                    <th class="p-2 w-8 text-center">Pos</th>
                                    <th class="p-2">Pilota</th>
                                    <th class="p-2 text-right">Tempo</th>
                                    <th class="p-2 text-right text-[#60A5FA]">Dist. 1°</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-leg-standings"></tbody>
                        </table>
                    </div>
                </div>

                <!-- 4. Classifica Rally (Dark) -->
                <div id="rally-standings-container">
                    <div class="bg-[#23211F] text-white p-3 rounded-t-lg border-b border-[#3D3833] flex justify-between items-center">
                        <h3 class="text-sm font-bold flex items-center gap-2"><i class="fa-solid fa-ranking-star text-[#E10600]"></i> Classifica Rally</h3>
                    </div>
                    <!-- Aggiunto max-h-[350px] per limitare l'altezza e far apparire lo scroll -->
                    <div class="bg-[#2C2A28] text-white max-h-[350px] overflow-y-auto custom-scrollbar border border-[#3D3833] rounded-b-lg">
                        <table class="w-full text-xs text-left">
                            <thead class="bg-[#23211F] text-[#A8A29A] uppercase sticky top-0">
                                <tr>
                                    <th class="p-2 w-8 text-center">Pos</th>
                                    <th class="p-2">Pilota</th>
                                    <th class="p-2 text-right">Tempo</th>
                                    <th class="p-2 text-right text-[#EAB308]">Dist. 1°</th>
                                    <th class="p-2 text-right">Punti</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-rally-standings">
                                <tr><td colspan="5" class="text-center p-4 text-gray-500">Seleziona un Rally</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <!-- COLONNA DESTRA: NEWS / STAGE / RISULTATI -->
            <div class="lg:col-span-4">
                <div id="right-col-container" class="h-full">
                    <!-- Popolato via JS (Default: News) -->
                </div>
            </div>

        </div>
    </main>

    <!-- API & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>

    <script>
        const v2State = {
            champ: null,
            tree: null,
            selectedRally: null,
            selectedLeg: null,
            selectedStage: null
        };

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await api.getChampionships();
                if (!res.data || res.data.length === 0) return;
                
                const urlParams = new URLSearchParams(window.location.search);
                const urlId = urlParams.get('id');
                v2State.champ = urlId ? (res.data.find(c => c.id == urlId) || res.data[0]) : (res.data.find(c => c.is_visible === true) || res.data[0]);
                
                document.getElementById('left-col-title').textContent = v2State.champ.name;
                
                // Carica Classifica Generale
                const standRes = await apiJson(`/standings/championship/${v2State.champ.id}`);
                await renderChampionshipStandings();

                // Carica Albero
                const treeRes = await apiJson(`/tree/${v2State.champ.id}`);
                v2State.tree = treeRes.data;
                
                // Seleziona il primo rally di default
                if (v2State.tree.rallies && v2State.tree.rallies.length > 0) {
                    selectRally(v2State.tree.rallies[0].id);
                }

                // Mostra le news di default a destra
                renderRightDefault();
                
            } catch (e) { console.error("Errore V2:", e); }
        });

        // --- COLONNA SINISTRA ---
        async function renderChampionshipStandings() {
            const tbody = document.getElementById('tbody-champ-standings');
            const thead = document.getElementById('champ-standings-thead');
            try {
                const res = await apiJson(`/standings/matrix/championship/${v2State.champ.id}`);
                const rallies = res.rallies || [];
                const drivers = res.drivers || [];

                // Costruisci l'header dinamicamente (Pos, Pilota, Cls, R1, R2..., Tot)
                let headHtml = `<th class="w-8 text-center">Pos</th><th>Pilota</th><th class="text-center">Cls</th>`;
                rallies.forEach((r, i) => {
                    headHtml += `<th class="text-center" title="${r.name}">R${i+1}</th>`;
                });
                headHtml += `<th class="text-right">Tot</th>`;
                thead.innerHTML = headHtml;

                if (drivers.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${4 + rallies.length}" class="text-center py-4">Nessun dato.</td></tr>`;
                    return;
                }

                tbody.innerHTML = drivers.map((d, i) => {
                    let cells = `
                        <td class="text-center font-bold">${i + 1}</td>
                        <td>
                            <div class="font-bold text-[#2C2A28]">${d.driver}</div>
                            <div class="text-[10px] text-[#6B665F]">${d.car || 'Auto sconosciuta'}</div>
                        </td>
                        <td class="text-center"><span class="bg-[#23211F] text-white text-[9px] px-1 rounded">R5</span></td>
                    `;
                    
                    rallies.forEach(r => {
                        const pts = d.rallies[r.id] || 0;
                        cells += `<td class="text-center ${pts > 0 ? 'font-bold' : 'text-gray-400'}">${pts > 0 ? pts : '-'}</td>`;
                    });

                    cells += `<td class="text-right font-black text-[#E10600] text-sm">${d.total}</td>`;

                    return `<tr class="${i === 0 ? 'row-first' : ''}">${cells}</tr>`;
                }).join('');

            } catch (e) { console.error("Errore classifica", e); }
        }

        // --- COLONNA CENTRALE ---
        function selectRally(rallyId) {
            v2State.selectedRally = v2State.tree.rallies.find(r => r.id === rallyId);
            v2State.selectedLeg = null; 
            v2State.selectedStage = null;

            renderRallyTabs();
            
            // --- AGGIUNGI QUESTE RIGHE ---
            const legsContainer = document.getElementById('legs-container');
            const bgUrl = getRallyBackground(v2State.selectedRally.name);
            legsContainer.style.backgroundImage = `linear-gradient(rgba(244, 241, 234, 0.9), rgba(244, 241, 234, 0.9)), url('${bgUrl}')`;
            legsContainer.style.backgroundSize = 'cover';
            legsContainer.style.backgroundPosition = 'center';
            // -----------------------------

            renderLegs();
            loadRallyStandings(rallyId);
            
            document.getElementById('leg-standings-container').classList.add('hidden');
            renderRightDefault();
        }

        function renderRallyTabs() {
            const container = document.getElementById('rally-tabs-container');
            container.innerHTML = v2State.tree.rallies.map(r => {
                const isActive = v2State.selectedRally.id === r.id;
                return `
                    <button onclick="selectRally(${r.id})" class="whitespace-nowrap px-4 py-3 font-racing font-bold text-lg border-b-2 transition-colors 
                        ${isActive ? 'bg-[#F4F1EA] border-[#E10600] text-[#2C2A28]' : 'bg-transparent border-transparent text-[#6B665F] hover:bg-[#E5E0D8]'}">
                        ${r.name}
                    </button>
                `;
            }).join('');
        }

        function renderLegs() {
            const container = document.getElementById('legs-container');
            if (!v2State.selectedRally.legs || v2State.selectedRally.legs.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-gray-500 bg-[#F4F1EA]">Nessuna Leg in questo Rally.</div>`;
                return;
            }
            container.innerHTML = v2State.selectedRally.legs.map(l => {
                const isActive = v2State.selectedLeg && v2State.selectedLeg.id === l.id;
                return `
                    <div class="border-b border-[#D1CBBF] last:border-0">
                        <div onclick="selectLeg(${l.id})" class="p-4 cursor-pointer flex justify-between items-center transition-colors
                            ${isActive ? 'bg-[#EBE6DC]' : 'bg-[#F4F1EA] hover:bg-[#EBE6DC]'}">
                            <div>
                                <div class="font-bold text-[#2C2A28] font-racing text-xl">${l.name}</div>
                                <div class="text-xs text-[#6B665F] font-bold mt-1">
                                    <i class="fa-solid fa-stopwatch mr-1"></i> ${l.total_stages || 0} Stage 
                                    <span class="mx-2">|</span> 
                                    <i class="fa-solid fa-road mr-1"></i> ${l.total_km || 0} km
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right ${isActive ? 'text-[#E10600]' : 'text-gray-400'}"></i>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function selectLeg(legId) {
            v2State.selectedLeg = v2State.selectedRally.legs.find(l => l.id === legId);
            v2State.selectedStage = null; 
            
            renderLegs(); 
            document.getElementById('leg-standings-container').classList.remove('hidden');
            
            try {
                const res = await apiJson(`/standings/leg/${legId}`);
                const tbody = document.getElementById('tbody-leg-standings');
                const leaderMs = res.data.length > 0 ? res.data[0].total_ms : 0;

                tbody.innerHTML = res.data.map((r, i) => {
                    const gapMs = r.total_ms - leaderMs;
                    const gapStr = gapMs === 0 ? '-' : `+${(gapMs/1000).toFixed(2)}`;
                    
                    return `
                        <tr class="border-b border-[#3D3833] last:border-0 ${i === 0 ? 'bg-[#3B82F6] text-white font-bold' : ''}">
                            <td class="p-2 text-center">${r.position}</td>
                            <td class="p-2 truncate">${r.driver}</td>
                            <td class="p-2 text-right font-mono">${r.total_str}</td>
                            <td class="p-2 text-right font-mono ${i === 0 ? 'text-white' : 'text-[#60A5FA]'}">${gapStr}</td>
                        </tr>
                    `;
                }).join('');
            } catch (e) { console.error(e); }

            renderRightStages();
        }

        async function loadRallyStandings(rallyId) {
            try {
                const res = await apiJson(`/standings/rally/${rallyId}`);
                const tbody = document.getElementById('tbody-rally-standings');
                const leaderMs = res.data.length > 0 ? res.data[0].total_ms : 0;

                tbody.innerHTML = res.data.map((r, i) => {
                    const gapMs = r.total_ms - leaderMs;
                    const gapStr = gapMs === 0 ? '-' : `+${(gapMs/1000).toFixed(2)}`;

                    return `
                        <tr class="border-b border-[#3D3833] last:border-0 ${i === 0 ? 'bg-[#EAB308] text-[#2C2A28] font-bold' : ''}">
                            <td class="p-2 text-center">${r.position}</td>
                            <td class="p-2 truncate">${r.driver}</td>
                            <td class="p-2 text-right font-mono">${r.total_str || '-'}</td>
                            <td class="p-2 text-right font-mono ${i === 0 ? '' : 'text-[#EAB308]'}">${gapStr}</td>
                            <td class="p-2 text-right font-bold">${r.points} pt</td>
                        </tr>
                    `;
                }).join('');
            } catch (e) { console.error(e); }
        }

        // --- COLONNA DESTRA ---
        function renderRightDefault() {
            const container = document.getElementById('right-col-container');
            const bgUrl = v2State.selectedRally ? getRallyBackground(v2State.selectedRally.name) : 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80';
            
            container.innerHTML = `
                <div class="card-wrc p-8 flex flex-col items-center justify-center min-h-[500px] text-center relative overflow-hidden rounded-xl border border-[#D1CBBF]">
                    <!-- Sfondo dinamico -->
                    <div class="absolute inset-0 bg-cover bg-center transition-all duration-500" style="background-image: url('${bgUrl}');"></div>
                    <div class="absolute inset-0 bg-[#23211F] opacity-75"></div>
                    
                    <div class="relative z-10 text-white">
                        <h2 class="text-4xl font-black font-racing mb-4 text-[#EAB308]">${v2State.champ.name}</h2>
                        <p class="text-lg font-medium opacity-80 mb-6">Seleziona una Leg dalla colonna centrale per visualizzare le Stage e i risultati.</p>
                        <div class="flex justify-center gap-4 text-sm font-bold bg-[#1A1816]/80 backdrop-blur-sm p-4 rounded-lg border border-[#3D3833]">
                            <span><i class="fa-solid fa-flag-checkered text-[#E10600] mr-1"></i> ${v2State.selectedRally?.total_stages || 0} Stage Totali</span>
                            <span><i class="fa-solid fa-road text-[#E10600] mr-1"></i> ${v2State.selectedRally?.total_km || 0} km</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRightStages() {
            const container = document.getElementById('right-col-container');
            const leg = v2State.selectedLeg;
            
            if (!leg || !leg.stages || leg.stages.length === 0) {
                container.innerHTML = `<div class="card-wrc p-8 text-center text-gray-500">Nessuna Stage in questa Leg.</div>`;
                return;
            }

            let stageHtml = leg.stages.map(s => `
                <div onclick="selectStage(${s.id})" class="card-wrc p-4 mb-3 cursor-pointer hover:border-[#E10600] transition-colors group flex justify-between items-center">
                    <div>
                        <h3 class="text-lg font-black font-racing text-[#2C2A28] group-hover:text-[#E10600]">${s.name}</h3>
                        <div class="flex gap-4 text-xs font-bold text-[#6B665F] mt-1">
                            <span><i class="fa-solid fa-sun text-[#EAB308] mr-1"></i> ${s.weather}</span>
                            <span><i class="fa-solid fa-road mr-1"></i> ${s.surface}</span>
                            <span><i class="fa-solid fa-temperature-half text-[#E10600] mr-1"></i> ${s.temperature}°C</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-400 group-hover:text-[#E10600]"></i>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="mb-4 flex justify-between items-end">
                    <h2 class="text-3xl font-black font-racing text-[#2C2A28]">${leg.name}</h2>
                    <button onclick="renderRightDefault()" class="text-sm text-[#6B665F] hover:text-[#E10600] font-bold"><i class="fa-solid fa-xmark mr-1"></i> Chiudi</button>
                </div>
                ${stageHtml}
            `;
        }

        async function selectStage(stageId) {
            let stageData = null;
            for (const leg of v2State.selectedRally.legs) {
                const s = leg.stages.find(st => st.id === stageId);
                if (s) { stageData = s; break; }
            }
            if (!stageData) return;
            v2State.selectedStage = stageData;

            const container = document.getElementById('right-col-container');
            container.innerHTML = `<div class="card-wrc p-12 text-center"><i class="fa-solid fa-spinner fa-spin text-3xl text-[#E10600] mb-4"></i><p>Caricamento risultati...</p></div>`;

            try {
                const res = await apiJson(`/standings/stage/${stageId}`);
                const data = res.data || [];
                const leaderTimeMs = data.length > 0 ? data[0].time_ms : 0;

                let rowsHtml = data.map((r, i) => {
                    // Calcolo Gap dal 1°
                    const gapToFirstMs = r.time_ms - leaderTimeMs;
                    const gapToFirstStr = gapToFirstMs === 0 ? '-' : `+${(gapToFirstMs/1000).toFixed(2)}`;

                    // Calcolo Gap dal precedente
                    let gapToPrevStr = '-';
                    if (i > 0) {
                        const prevMs = data[i-1].time_ms;
                        const gapToPrevMs = r.time_ms - prevMs;
                        gapToPrevStr = `+${(gapToPrevMs/1000).toFixed(2)}`;
                    }

                    return `
                        <tr class="${i === 0 ? 'row-first' : ''}">
                            <td class="text-center font-bold">${r.position}</td>
                            <td>${r.driver_name}</td>
                            <td class="text-xs font-semibold text-[#6B665F]">${r.car_model}</td>
                            <td class="text-right font-mono font-bold">${r.time_str}</td>
                            <td class="text-right text-[#E10600] font-mono">${gapToPrevStr}</td>
                            <td class="text-right text-[#6B665F] font-mono">${gapToFirstStr}</td>
                        </tr>
                    `;
                }).join('');

                if (data.length === 0) {
                    rowsHtml = `<tr><td colspan="6" class="text-center py-4 text-gray-500">Nessun risultato ufficiale per questa Stage.</td></tr>`;
                }

                container.innerHTML = `
                    <div class="card-wrc overflow-hidden relative">
                        <div class="p-4 border-b border-[#D1CBBF] bg-[#F4F1EA] flex justify-between items-start">
                            <div>
                                <h2 class="text-3xl font-black italic mb-2 text-[#2C2A28] flex items-center gap-3">
                                    <i class="fa-solid fa-stopwatch text-[#E10600]"></i>
                                    <a href="stage-detail.html?id=${v2State.selectedStage.id}" target="_blank" class="hover:text-[#E10600] transition-colors flex items-center gap-2">
                                    ${v2State.selectedStage.name}
                                        <i class="fa-solid fa-up-right-from-square text-sm opacity-50"></i>
                                    </a>
                                </h2>
                                <div class="flex gap-4 text-sm font-bold text-[#6B665F]">
                                    <span><i class="fa-solid fa-sun text-[#EAB308] mr-1"></i> ${v2State.selectedStage.weather}</span>
                                    <span><i class="fa-solid fa-road mr-1"></i> ${v2State.selectedStage.surface}</span>
                                    <span><i class="fa-solid fa-temperature-half text-[#E10600] mr-1"></i> ${v2State.selectedStage.temperature}°C</span>
                                </div>
                            </div>
                            <button onclick="renderRightStages()" class="bg-[#23211F] hover:bg-[#3D3833] text-white px-3 py-1 text-xs font-bold rounded transition-colors"><i class="fa-solid fa-arrow-left mr-1"></i> Torna alle Stage</button>
                        </div>
                        
                        <table class="w-full table-wrc text-sm">
                            <thead>
                                <tr>
                                    <th class="w-10 text-center">Pos</th>
                                    <th>Pilota</th>
                                    <th>Vettura</th>
                                    <th class="text-right">Tempo</th>
                                    <th class="text-right text-[#E10600]">Dist. Prec.</th>
                                    <th class="text-right text-[#6B665F]">Dist. 1°</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = `<div class="card-wrc p-4 text-red-500">Errore: ${e.message}</div>`;
            }
        }

        function getRallyBackground(rallyName) {
            const n = rallyName.toLowerCase();
            if (n.includes('monte') || n.includes('turini') || n.includes('alsazia')) 
                return 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80'; // Montagne
            if (n.includes('galles') || n.includes('foresta')) 
                return 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80'; // Foresta
            if (n.includes('grecia') || n.includes('sterrato')) 
                return 'https://images.unsplash.com/photo-1505993597083-3bd19eb4596b?auto=format&fit=crop&q=80'; // Sterrato/Terra
            return 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80'; // Default
        }
    </script>
</body>
</html>
