<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login - ACR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-96">
        <h2 class="text-2xl font-bold mb-6 text-center">Accedi ad ACR</h2>
        <form id="login-form">
            <div class="mb-4">
                <label class="block text-sm mb-2">Email</label>
                <input type="email" id="email" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600 focus:outline-none focus:border-yellow-500" required>
            </div>
            <div class="mb-6">
                <label class="block text-sm mb-2">Password</label>
                <input type="password" id="password" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600 focus:outline-none focus:border-yellow-500" required>
            </div>
            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-2 rounded transition-colors">Entra</button>
        </form>
        <div id="error-msg" class="text-red-400 text-sm mt-4 text-center hidden"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            const errorMsg = document.getElementById('error-msg');

            btn.textContent = 'Caricamento...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
                btn.textContent = 'Entra';
                btn.disabled = false;
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
