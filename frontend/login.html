<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login - ACR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-96">
        <h2 class="text-2xl font-bold mb-6 text-center">Accedi ad ACR</h2>
        <form id="login-form">
            <div class="mb-4">
                <label class="block text-sm mb-2">Email</label>
                <input type="email" id="email" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600 focus:outline-none focus:border-yellow-500" required>
            </div>
            <div class="mb-6">
                <label class="block text-sm mb-2">Password</label>
                <input type="password" id="password" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600 focus:outline-none focus:border-yellow-500" required>
            </div>
            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-2 rounded transition-colors">Entra</button>
            <p class="text-center text-sm text-gray-500 mt-4">Non hai un account? <a href="register.html" class="text-[#E10600] font-bold hover:underline">Registrati qui</a></p>
        </form>
        <div id="error-msg" class="text-red-400 text-sm mt-4 text-center hidden"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
        <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form'); // Assicurati che il tuo form abbia questo ID
            
            if(loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const btn = loginForm.querySelector('button[type="submit"]');
                    
                    btn.disabled = true;
                    btn.innerHTML = 'Accesso...';

                    try {
                        const sb = window.supabaseClient || window.supabase;
                        const { data, error } = await sb.auth.signInWithPassword({ email, password });
                        
                        if (error) throw error;

                        const isAdmin = data.user.app_metadata?.role === 'admin';
                        
                        if (isAdmin) {
                            window.location.href = 'dashboard.html';
                        } else {
                            // Controllo Ban (solo per gli utenti normali)
                            try {
                                const res = await apiJson(`/user/${data.user.id}/stats`); // Usiamo questa rotta che già conosciamo
                                // Per farlo funzionare, dobbiamo restituire is_banned dalla rotta stats, 
                                // oppure fare una chiamata apposita. Usiamo una chiamata finta per ora.
                                const statusRes = await apiJson('/profile-status'); 
                                if (statusRes && statusRes.is_banned) {
                                    await sb.auth.signOut();
                                    throw new Error("Il tuo account è stato sospeso. Contatta un amministratore.");
                                }
                            } catch (err) {
                                if(err.message.includes("sospeso")) throw err; 
                                // Se la rotta non esiste ancora, ignoriamo l'errore e facciamo entrare
                            }
                            
                            window.location.href = 'index-v2.html';
                        }
                    } catch (err) {
                        alert("Errore di login: " + err.message);
                        btn.disabled = false;
                        btn.innerHTML = 'Accedi';
                    }
                });
            }
        });
    </script>
</body>
</html>
