<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Book - ACR Championship</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Stili per la visualizzazione a schermo */
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .page-container { max-width: 1200px; margin: 2rem auto; background: white; padding: 3rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* Stili specifici per la stampa PDF */
        @media print {
            body { background: white; }
            .page-container { margin: 0; padding: 0; box-shadow: none; max-width: 100%; }
            .no-print { display: none !important; }
            .page-break { page-break-before: always; }
            
            /* Stili Tabelle */
            .print-table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; font-size: 12px; }
            .print-table th, .print-table td { border: 1px solid #ccc; padding: 6px; text-align: left; }
            .print-table th { background-color: #eee; font-weight: bold; text-transform: uppercase; font-size: 10px; }
            
            /* Intestazione Leg nella tabella */
            .leg-header-row td { 
                background-color: #e5e7eb !important; 
                font-weight: 900 !important; 
                font-size: 14px !important; 
                color: #000 !important;
                border-top: 2px solid #999 !important;
                padding: 10px 6px !important;
                text-transform: uppercase;
            }

            /* Info Table (Riepilogo Rally) */
            .info-table { width: 100%; margin-bottom: 1rem; font-size: 12px; border-collapse: collapse; }
            .info-table td { padding: 4px 8px; border-bottom: 1px solid #eee; }
            .info-table .label { font-weight: bold; width: 150px; color: #555; }
        }
    </style>
</head>
<body>

    <div class="page-container">
        
        <!-- HEADER SOLO PER SCHERMO (NON STAMPATO) -->
        <div class="no-print mb-8 flex justify-between items-center bg-gray-100 p-4 rounded-lg border border-gray-300">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Road Book Anteprima</h1>
                <p class="text-sm text-gray-600">Questo è il documento che verrà stampato. Usa il pulsante per salvare in PDF.</p>
            </div>
            <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold shadow-md transition-colors">
                <i class="fa-solid fa-print mr-2"></i> Stampa / Salva PDF
            </button>
        </div>

        <!-- CONTENUTO DA STAMPARE -->
        <div id="roadbook-content">
            <div class="text-center py-10 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i><p>Generazione Road Book...</p></div>
        </div>

    </div>

    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const champId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!champId) {
                document.getElementById('roadbook-content').innerHTML = '<div class="text-red-500 text-center text-xl font-bold">Errore: ID Campionato non fornito.</div>';
                return;
            }

            try {
                const res = await apiJson(`/tree/${champId}`);
                if (!res.success) throw new Error(res.error);
                
                const data = res.data;
                const champ = data.championship;
                const rallies = data.rallies || [];

                let html = `
                    <div class="text-center mb-8 border-b-2 border-gray-800 pb-4">
                        <h1 class="text-3xl font-black uppercase text-gray-900">${champ.name}</h1>
                        <p class="text-sm font-bold text-gray-600 uppercase tracking-widest mt-1">Road Book Ufficiale - Impostazioni Campionato</p>
                    </div>
                `;

                if (rallies.length === 0) {
                    html += `<p class="text-center text-gray-500 italic">Nessun rally configurato in questo campionato.</p>`;
                }

                rallies.forEach((rally, index) => {
                    // Aggiungi un salto pagina per ogni rally (tranne il primo)
                    const pageBreakClass = index > 0 ? 'page-break' : '';

                    // Formattazione date per il riepilogo
                    let dateRange = 'Date non definite';
                    if (rally.start_date && rally.end_date) {
                        dateRange = `${new Date(rally.start_date).toLocaleDateString('it-IT')} - ${new Date(rally.end_date).toLocaleDateString('it-IT')}`;
                    } else if (rally.start_date) {
                        dateRange = new Date(rally.start_date).toLocaleDateString('it-IT');
                    }

                    html += `
                        <div class="mb-10 ${pageBreakClass}">
                            
                            <!-- TABELLA RIEPILOGO RALLY -->
                            <table class="info-table mb-6 bg-gray-50 border border-gray-200">
                                <tr>
                                    <td class="label">Nome Rally</td>
                                    <td class="font-bold text-lg">${rally.name}</td>
                                </tr>
                                <tr>
                                    <td class="label">Periodo di Svolgimento</td>
                                    <td>${dateRange}</td>
                                </tr>
                                <tr>
                                    <td class="label">Totale Leg / Stage</td>
                                    <td>${rally.total_legs || 0} Leg &bull; ${rally.total_stages || 0} Stage &bull; ${rally.total_km || 0} km</td>
                                </tr>
                            </table>

                            <h3 class="text-lg font-black uppercase text-gray-800 border-b border-gray-400 mb-2">Programma Gara</h3>
                    `;

                    if (!rally.legs || rally.legs.length === 0) {
                        html += `<p class="text-sm italic text-gray-600 mb-4">Nessuna Leg configurata.</p>`;
                    } else {
                        html += `
                            <table class="print-table">
                                <thead>
                                    <tr>
                                        <th style="width: 20%">Stage</th>
                                        <th style="width: 25%">Tracciato</th>
                                        <th style="width: 8%">Km</th>
                                        <th style="width: 12%">Meteo</th>
                                        <th style="width: 15%">Fondo</th>
                                        <th style="width: 8%">Temp.</th>
                                        <th style="width: 7%">Orario</th>
                                        <th style="width: 5%">Diff.</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;

                        rally.legs.forEach(leg => {
                            // Formattazione data leg
                            const legDate = leg.date ? ` - Data: ${new Date(leg.date).toLocaleDateString('it-IT')}` : '';
                            
                            // Riga di intestazione della Leg
                            html += `
                                <tr class="leg-header-row">
                                    <td colspan="8">
                                        <i class="fa-solid fa-road mr-2"></i> ${leg.name} ${legDate} (${leg.country || 'N/D'})
                                    </td>
                                </tr>
                            `;

                            if (!leg.stages || leg.stages.length === 0) {
                                html += `<tr><td colspan="8" class="italic text-gray-500 text-center py-2">Nessuna stage configurata in questa Leg.</td></tr>`;
                            } else {
                                leg.stages.forEach(stage => {
                                    html += `
                                        <tr>
                                            <td><strong>${stage.name}</strong></td>
                                            <td>${stage.track_name || '-'}</td>
                                            <td>${stage.distance_km ? stage.distance_km + ' km' : '-'}</td>
                                            <td>${stage.weather || '-'}</td>
                                            <td>${stage.surface || '-'}</td>
                                            <td>${stage.temperature ? stage.temperature + '°C' : '-'}</td>
                                            <td>${stage.start_time || '-'}</td>
                                            <td>${stage.track_difficulty || '-'}</td>
                                        </tr>
                                    `;
                                });
                            }
                        });

                        html += `</tbody></table>`;
                    }

                    html += `</div>`;
                });

                // Aggiungi footer
                html += `
                    <div class="mt-10 text-center text-xs text-gray-500 border-t border-gray-300 pt-4">
                        Documento generato automaticamente da ACR Championship.<br>
                        Le impostazioni potrebbero variare in base alle condizioni della lobby.
                    </div>
                `;

                document.getElementById('roadbook-content').innerHTML = html;

            } catch (e) {
                document.getElementById('roadbook-content').innerHTML = `<div class="text-red-500 text-center font-bold">Errore: ${e.message}</div>`;
            }
        });
    </script>
</body>
</html>
