<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Campionato - ACR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vrg: { bg: '#0B1120', sidebar: '#0F172A', card: '#1E293B', accent: '#EAB308', text: '#94A3B8', textlight: '#F1F5F9' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-vrg-bg text-vrg-text font-sans h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-vrg-sidebar border-r border-slate-800 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="p-6 flex items-center gap-3">
                <div class="text-vrg-accent text-2xl font-bold italic tracking-tighter">VRG</div>
            </div>
            <nav class="mt-4 px-3 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white mb-6">
                    <i class="fa-solid fa-arrow-left w-5"></i> Torna ai Campionati
                </a>

                <div class="px-4 text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Filtri Vista</div>
                <button onclick="setFilter('all')" id="btn-filter-all" class="filter-btn w-full flex items-center gap-3 px-4 py-2 text-sm font-medium rounded-lg text-white bg-slate-800">
                    <i class="fa-solid fa-layer-group w-5"></i> Tutti
                </button>
                <button onclick="setFilter('rally')" id="btn-filter-rally" class="filter-btn w-full flex items-center gap-3 px-4 py-2 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-flag-checkered w-5"></i> Solo Rally
                </button>
                <button onclick="setFilter('leg')" id="btn-filter-leg" class="filter-btn w-full flex items-center gap-3 px-4 py-2 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-road w-5"></i> Solo Leg
                </button>
                <button onclick="setFilter('stage')" id="btn-filter-stage" class="filter-btn w-full flex items-center gap-3 px-4 py-2 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-stopwatch w-5"></i> Solo Stage
                </button>
            </nav>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">

        <header class="h-20 bg-vrg-bg border-b border-slate-800 flex items-center justify-between px-8 shrink-0">
            <div class="flex items-center gap-4">
                <h1 id="header-title" class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-spinner fa-spin text-vrg-accent"></i> Caricamento...
                </h1>
                <button id="btn-discord-championship"
            class="hidden text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-bold flex items-center gap-2 transition-colors"
            title="Pubblica la classifica campionato su Discord">
            <i class="fa-brands fa-discord"></i> Pubblica classifica
                </button>
            </div>
            <div id="user-controls" class="flex items-center gap-4">
                <!-- Popolato da JS -->
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-white">Struttura Campionato</h2>
                <button id="btn-add-rally" class="admin-only bg-vrg-accent hover:bg-yellow-500 text-black px-5 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors shadow-lg hidden" onclick="openModal('modal-rally')">
                    <i class="fa-solid fa-plus"></i> Aggiungi Rally
                </button>
            </div>

            <!-- AREA ALBERO -->
            <div id="tree-container" class="space-y-4">
                <!-- Popolato via JS -->
            </div>
        </div>
    </main>

    <!-- MODALE AGGIUNGI RALLY -->
    <div id="modal-rally" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-vrg-card p-8 rounded-xl w-full max-w-md border border-slate-700 shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-4">Nuovo Rally</h2>
            <input type="text" id="input-nome-rally" placeholder="Nome Rally" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:border-vrg-accent">
            <div class="flex justify-end gap-3 mt-8">
                <button onclick="closeModal('modal-rally')" class="px-5 py-2 rounded-lg text-sm text-slate-300 hover:text-white">Annulla</button>
                <button id="btn-salva-rally" class="bg-vrg-accent text-black px-5 py-2 rounded-lg text-sm font-bold">Salva</button>
            </div>
        </div>
    </div>

    <!-- MODALE AGGIUNGI LEG -->
    <div id="modal-leg" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-vrg-card p-8 rounded-xl w-full max-w-md border border-slate-700 shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-4">Nuova Leg</h2>
            <input type="hidden" id="input-leg-rally-id">
            <input type="text" id="input-nome-leg" placeholder="Nome Leg" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:border-vrg-accent">
            <div class="flex justify-end gap-3 mt-8">
                <button onclick="closeModal('modal-leg')" class="px-5 py-2 rounded-lg text-sm text-slate-300 hover:text-white">Annulla</button>
                <button id="btn-salva-leg" class="bg-vrg-accent text-black px-5 py-2 rounded-lg text-sm font-bold">Salva</button>
            </div>
        </div>
    </div>

    <!-- MODALE AGGIUNGI STAGE -->
    <div id="modal-stage" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-vrg-card p-8 rounded-xl w-full max-w-md border border-slate-700 shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-4">Nuova Stage</h2>
            <input type="hidden" id="input-stage-leg-id">
            <input type="text" id="input-nome-stage" placeholder="Nome Stage" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:border-vrg-accent">
            <input type="text" id="input-track-stage" placeholder="Tracciato (Opzionale)" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:border-vrg-accent">
            <div class="flex justify-end gap-3 mt-8">
                <button onclick="closeModal('modal-stage')" class="px-5 py-2 rounded-lg text-sm text-slate-300 hover:text-white">Annulla</button>
                <button id="btn-salva-stage" class="bg-vrg-accent text-black px-5 py-2 rounded-lg text-sm font-bold">Salva</button>
            </div>
        </div>
    </div>

    <!-- MODALE INSERIMENTO RISULTATI -->
    <div id="modal-risultati" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-vrg-card p-6 rounded-xl w-full max-w-4xl border border-slate-700 shadow-2xl flex flex-col max-h-[90vh]">

            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-list-ol text-vrg-accent"></i> Risultati: <span id="modal-risultati-title" class="text-vrg-accent"></span>
                </h2>

                <!-- AREA UPLOAD OCR -->
                <div id="ocr-container" class="flex items-center gap-3 bg-slate-800 p-2 rounded-lg border border-slate-700">
                    <input type="file" id="ocr-file-input" accept="image/*" class="hidden" onchange="handleOcrUpload(event)">
                    <button onclick="document.getElementById('ocr-file-input').click()" id="btn-upload-ocr" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm font-bold flex items-center gap-2 transition-colors">
                        <i class="fa-solid fa-camera"></i> Carica Screenshot (OCR)
                    </button>
                    <span id="ocr-status" class="text-xs text-slate-400"></span>
                </div>
            </div>

            <input type="hidden" id="input-risultati-stage-id">

            <!-- BANNER STATO BOZZA/UFFICIALE -->
            <div id="results-status-banner" class="hidden mb-3 px-3 py-2 rounded text-sm"></div>

            <div class="flex-1 overflow-y-auto pr-2">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="text-xs uppercase bg-slate-800 text-slate-400 sticky top-0 z-10">
                        <tr>
                            <th class="px-2 py-2 w-12 text-center">Pos</th>
                            <th class="px-2 py-2">Pilota</th>
                            <th class="px-2 py-2">Auto</th>
                            <th class="px-2 py-2 w-32">Tempo</th>
                            <th class="px-2 py-2 w-24">Penalità</th>
                            <th class="px-2 py-2 w-10 text-center">X</th>
                        </tr>
                    </thead>
                    <tbody id="risultati-tbody">
                        <!-- Righe aggiunte via JS -->
                    </tbody>
                </table>
                <button id="btn-add-pilota" onclick="addResultRow()" class="mt-4 text-sm text-vrg-accent hover:text-yellow-400 font-bold flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-plus"></i> Aggiungi Pilota Manualmente
                </button>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-700">
                <button onclick="closeModal('modal-risultati')" class="px-5 py-2 rounded-lg text-sm text-slate-300 hover:text-white transition-colors">Annulla</button>
                <button id="btn-save-draft" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors hidden">
                    <i class="fa-solid fa-floppy-disk"></i> Salva bozza
                </button>
                <button id="btn-publish" class="bg-green-600 hover:bg-green-500 text-white px-5 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors hidden">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Pubblica
                </button>
            </div>
        </div>
    </div>

    <!-- MODALE CLASSIFICHE -->
    <div id="modal-standings" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-vrg-card p-6 rounded-xl w-full max-w-2xl border border-slate-700 shadow-2xl flex flex-col max-h-[90vh]">
            <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-ranking-star text-vrg-accent"></i> <span id="standings-title"></span>
            </h2>
            <div class="flex-1 overflow-y-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="text-xs uppercase bg-slate-800 text-slate-400 sticky top-0">
                        <tr>
                            <th class="px-4 py-3 w-16">Pos</th>
                            <th class="px-4 py-3">Pilota</th>
                            <th class="px-4 py-3">Auto</th>
                            <th class="px-4 py-3">Tempo Totale</th>
                            <th class="px-4 py-3">Punti</th>
                        </tr>
                    </thead>
                    <tbody id="standings-tbody"></tbody>
                </table>
            </div>
            <div class="flex justify-end mt-4 pt-4 border-t border-slate-700">
                <button onclick="closeModal('modal-standings')" class="bg-slate-700 text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-600">Chiudi</button>
            </div>
        </div>
    </div>

    <!-- MODALE PUBBLICAZIONE DISCORD -->
    <div id="modal-discord" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-vrg-card p-6 rounded-xl w-full max-w-lg border border-slate-700 shadow-2xl flex flex-col">
            <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-brands fa-discord text-indigo-400"></i>
                <span id="discord-modal-title">Pubblica su Discord</span>
            </h2>

            <div id="discord-modal-banner" class="hidden mb-3 px-3 py-2 rounded text-sm"></div>

            <div class="space-y-3">
                <div>
                    <label class="text-xs uppercase tracking-wider text-slate-500 mb-1 block">Webhook URL</label>
                    <input id="discord-webhook-input" type="text" placeholder="https://discord.com/api/webhooks/..."
                        class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:border-vrg-accent">
                    <p id="discord-webhook-hint" class="text-xs text-slate-500 mt-1">Precompilato dal rally se configurato. Modificabile.</p>
                </div>

                <div>
                    <label class="text-xs uppercase tracking-wider text-slate-500 mb-1 block">Thread ID (opzionale)</label>
                    <input id="discord-thread-input" type="text" placeholder="Lasciare vuoto per pubblicare nel canale principale"
                        class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:border-vrg-accent">
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-700">
                <button onclick="closeModal('modal-discord')" class="px-5 py-2 rounded-lg text-sm text-slate-300 hover:text-white transition-colors">Annulla</button>
                <button id="btn-discord-confirm"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors">
                        <i class="fa-brands fa-discord"></i> Pubblica
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const champId = urlParams.get('id');
        let currentFilter = 'all';
        let treeData = null;
        let isAdmin = false;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!champId) {
                alert("ID Campionato mancante");
                window.location.href = 'dashboard.html';
                return;
            }

            // 1. Sessione e Admin
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                isAdmin = session.user.app_metadata?.role === 'admin';

                document.getElementById('user-controls').innerHTML = `
                    <span class="text-sm text-slate-400 hidden md:block">${session.user.email}</span>
                    <button onclick="supabase.auth.signOut().then(()=>window.location.href='dashboard.html')" class="text-slate-400 hover:text-red-400 transition-colors" title="Logout">
                        <i class="fa-solid fa-power-off text-lg"></i>
                    </button>
                `;
            } else {
                document.getElementById('user-controls').innerHTML = `
                    <a href="login.html" class="text-sm text-vrg-accent hover:text-white font-bold">Accedi</a>
                `;
            }

            // 2. Carica albero
            await loadTree();

            // 3. Eventi modali creazione
            document.getElementById('btn-salva-rally').onclick = async () => {
                const nome = document.getElementById('input-nome-rally').value.trim();
                if (!nome) return alert("Inserisci un nome");
                try {
                    await api.createRally({ championship_id: champId, name: nome });
                    closeModal('modal-rally');
                    document.getElementById('input-nome-rally').value = '';
                    await loadTree();
                } catch (e) { alert("Errore: " + e.message); }
            };

            document.getElementById('btn-salva-leg').onclick = async () => {
                const rallyId = document.getElementById('input-leg-rally-id').value;
                const nome = document.getElementById('input-nome-leg').value.trim();
                if (!nome) return alert("Inserisci un nome");
                try {
                    await api.createLeg({ rally_id: rallyId, name: nome });
                    closeModal('modal-leg');
                    document.getElementById('input-nome-leg').value = '';
                    await loadTree();
                } catch (e) { alert("Errore: " + e.message); }
            };

            document.getElementById('btn-salva-stage').onclick = async () => {
                const legId = document.getElementById('input-stage-leg-id').value;
                const nome = document.getElementById('input-nome-stage').value.trim();
                const track = document.getElementById('input-track-stage').value.trim();
                if (!nome) return alert("Inserisci un nome");
                try {
                    await api.createStage({ leg_id: legId, name: nome, track_name: track });
                    closeModal('modal-stage');
                    document.getElementById('input-nome-stage').value = '';
                    document.getElementById('input-track-stage').value = '';
                    await loadTree();
                } catch (e) { alert("Errore: " + e.message); }
            };
        });

        function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn w-full flex items-center gap-3 px-4 py-2 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors";
            });
            const activeBtn = document.getElementById(`btn-filter-${filter}`);
            if (activeBtn) {
                activeBtn.className = "filter-btn w-full flex items-center gap-3 px-4 py-2 text-sm font-medium rounded-lg text-white bg-slate-800";
            }
            renderTree();
        }

        async function loadTree() {
            const container = document.getElementById('tree-container');
            try {
                const res = await api.getTree(champId);
                if (!res.success) throw new Error(res.error);

                treeData = res.data;
                document.getElementById('header-title').innerHTML = `<i class="fa-solid fa-trophy text-vrg-accent"></i> ${treeData.championship.name}`;

                const btnAddRally = document.getElementById('btn-add-rally');
                if (isAdmin) btnAddRally.classList.remove('hidden');
                else btnAddRally.classList.add('hidden');

                const btnDiscordChamp = document.getElementById('btn-discord-championship');
                if (btnDiscordChamp) {
                if (isAdmin) {
                    btnDiscordChamp.classList.remove('hidden');
                    btnDiscordChamp.onclick = () => openDiscordPublish('championship', parseInt(champId), treeData?.championship?.name || 'Campionato');
                } else {
                    btnDiscordChamp.classList.add('hidden');
            }
        }

                renderTree();
            } catch (e) {
                container.innerHTML = `<div class="text-red-400 p-4 bg-red-900/20 rounded-lg">Errore: ${e.message}</div>`;
            }
        }

        function renderTree() {
            const container = document.getElementById('tree-container');
            container.innerHTML = '';

            if (!treeData || !treeData.rallies || treeData.rallies.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-500 border border-slate-700 border-dashed rounded-xl">Nessun Rally presente.</div>`;
                return;
            }

            treeData.rallies.forEach(rally => {
                const rallyEl = document.createElement('div');
                rallyEl.className = "bg-vrg-card border border-slate-700 rounded-xl overflow-hidden mb-4";

                const adminLegBtn = isAdmin
                    ? `<button onclick="event.stopPropagation(); openAddLeg(${rally.id})" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded mr-2 transition-colors"><i class="fa-solid fa-plus"></i> Leg</button>`
                    : '';

                const rallyStandingsBtn = `<button onclick="event.stopPropagation(); viewStandings('rally', ${rally.id})" class="text-xs bg-slate-800 border border-slate-600 hover:bg-slate-700 text-white px-3 py-1 rounded transition-colors"><i class="fa-solid fa-ranking-star text-vrg-accent"></i> Classifica Rally</button>`;
                const rallyDiscordBtn = isAdmin
                ? `<button onclick="event.stopPropagation(); openDiscordPublish('rally', ${rally.id}, ${JSON.stringify(rally.name)})" class="text-xs bg-indigo-900/40 border border-indigo-700 hover:bg-indigo-800 text-indigo-300 px-2 py-1 rounded ml-1 transition-colors" title="Pubblica classifica su Discord"><i class="fa-brands fa-discord"></i></button>`
                : '';

                let innerHtml = `
                    <div class="flex items-center justify-between p-4 bg-slate-800/50 cursor-pointer" onclick="toggleVisibility('rally-body-${rally.id}')">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-chevron-down text-slate-400 transition-transform" id="icon-rally-${rally.id}"></i>
                            <i class="fa-solid fa-flag-checkered text-vrg-accent"></i>
                            <span class="font-bold text-white text-lg">${rally.name}</span>
                        </div>
                        <div>${adminLegBtn} ${rallyStandingsBtn} ${rallyDiscordBtn}</div>
                    </div>
                    <div id="rally-body-${rally.id}" class="p-2 space-y-2">
                `;

                if (!rally.legs || rally.legs.length === 0) {
                    innerHtml += `<div class="text-sm text-slate-500 p-2 pl-8">Nessuna Leg presente.</div>`;
                } else {
                    rally.legs.forEach(leg => {
                        const adminStageBtn = isAdmin
                            ? `<button onclick="event.stopPropagation(); openAddStage(${leg.id})" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded mr-2 transition-colors"><i class="fa-solid fa-plus"></i> Stage</button>`
                            : '';
                        const legStandingsBtn = `<button onclick="event.stopPropagation(); viewStandings('leg', ${leg.id})" class="text-xs bg-slate-800 border border-slate-600 hover:bg-slate-700 text-white px-3 py-1 rounded transition-colors"><i class="fa-solid fa-stopwatch text-vrg-accent"></i> Tempi Leg</button>`;
                        const legDiscordBtn = isAdmin
                        ? `<button onclick="event.stopPropagation(); openDiscordPublish('leg', ${leg.id}, ${JSON.stringify(leg.name)})" class="text-xs bg-indigo-900/40 border border-indigo-700 hover:bg-indigo-800 text-indigo-300 px-2 py-1 rounded ml-1 transition-colors" title="Pubblica classifica leg su Discord"><i class="fa-brands fa-discord"></i></button>`
                        : '';

                        innerHtml += `
                            <div class="ml-4 border-l border-slate-700 pl-4">
                                <div class="flex items-center justify-between py-2 cursor-pointer" onclick="toggleVisibility('leg-body-${leg.id}')">
                                    <div class="flex items-center gap-3">
                                        <i class="fa-solid fa-chevron-down text-slate-500 text-xs transition-transform" id="icon-leg-${leg.id}"></i>
                                        <i class="fa-solid fa-road text-slate-300"></i>
                                        <span class="font-semibold text-slate-200">${leg.name}</span>
                                    </div>
                                    <div>${adminStageBtn} ${legStandingsBtn} ${legDiscordBtn}</div>
                                </div>
                                <div id="leg-body-${leg.id}" class="ml-6 space-y-1 pb-2">
                        `;

                        if (!leg.stages || leg.stages.length === 0) {
                            innerHtml += `<div class="text-xs text-slate-500 py-1">Nessuna Stage presente.</div>`;
                        } else {
                            leg.stages.forEach(stage => {
                                // Pallino a tre stati: verde = ufficiale, giallo = bozza (solo admin), grigio = vuoto
                                // Fallback su has_results per retro-compatibilità
                                const hasOfficial = stage.has_official_results === true || stage.has_results === true;
                                const hasDraft = stage.has_draft_results === true;

                                let statusIcon;
                                if (hasOfficial) {
                                    statusIcon = `<i class="fa-solid fa-circle text-green-500 text-[8px] ml-1" title="Risultati ufficiali"></i>`;
                                } else if (hasDraft && isAdmin) {
                                    statusIcon = `<i class="fa-solid fa-circle text-yellow-400 text-[8px] ml-1" title="Bozza in attesa di pubblicazione"></i>`;
                                } else {
                                    statusIcon = `<i class="fa-regular fa-circle text-slate-600 text-[8px] ml-1" title="In attesa di risultati"></i>`;
                                }

                                innerHtml += `
                                    <div class="flex items-center justify-between py-1 px-2 hover:bg-slate-800/50 rounded transition-colors group">
                                        <div class="flex items-center gap-3 cursor-pointer" onclick="openStageResults(${stage.id})">
                                            <i class="fa-solid fa-stopwatch text-slate-500 text-xs"></i>
                                            <span class="text-sm text-slate-300 font-medium hover:text-vrg-accent transition-colors">${stage.name}</span>
                                            ${statusIcon}
                                            <span class="text-xs text-slate-500">(${stage.track_name || 'Tracciato'})</span>
                                        </div>
                                        <div class="flex items-center gap-1">
                                            <button onclick="event.stopPropagation(); openStageResults(${stage.id})" class="text-xs text-slate-400 hover:text-vrg-accent transition-colors px-2 py-1 bg-slate-800/50 rounded border border-slate-700 hover:border-vrg-accent" title="Visualizza/Gestisci Risultati">
                                                <i class="fa-solid fa-list-ol"></i> Risultati
                                            </button>
                                            ${isAdmin && hasOfficial
                                            ? `<button onclick="event.stopPropagation(); openDiscordPublish('stage', ${stage.id}, ${JSON.stringify(stage.name)})" class="text-xs bg-indigo-900/40 border border-indigo-700 hover:bg-indigo-800 text-indigo-300 px-2 py-1 rounded transition-colors" title="Pubblica risultati stage su Discord"><i class="fa-brands fa-discord"></i></button>`
                                            : ''}
                                        </div>
                                    </div>
                                `;
                            });
                        }
                        innerHtml += `</div></div>`;
                    });
                }
                innerHtml += `</div>`;
                rallyEl.innerHTML = innerHtml;
                container.appendChild(rallyEl);
            });
        }

        function toggleVisibility(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById(id.replace('body', 'icon'));
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                if (icon) icon.style.transform = 'rotate(0deg)';
            } else {
                el.classList.add('hidden');
                if (icon) icon.style.transform = 'rotate(-90deg)';
            }
        }

        function openAddLeg(rallyId) {
            document.getElementById('input-leg-rally-id').value = rallyId;
            openModal('modal-leg');
        }

        function openAddStage(legId) {
            document.getElementById('input-stage-leg-id').value = legId;
            openModal('modal-stage');
        }

        async function openStageResults(stageId) {
            let stageName = 'Stage';
            if (treeData && treeData.rallies) {
                for (const rally of treeData.rallies) {
                    if (rally.legs) {
                        for (const leg of rally.legs) {
                            if (leg.stages) {
                                const s = leg.stages.find(st => st.id === stageId);
                                if (s) { stageName = s.name; break; }
                            }
                        }
                    }
                }
            }

            document.getElementById('input-risultati-stage-id').value = stageId;
            document.getElementById('modal-risultati-title').textContent = stageName;
            document.getElementById('risultati-tbody').innerHTML = '';

            // Controlli admin
            const adminControls = document.getElementById('ocr-container');
            const btnSaveDraft = document.getElementById('btn-save-draft');
            const btnPublish = document.getElementById('btn-publish');
            const btnAddPilota = document.getElementById('btn-add-pilota');

            if (isAdmin) {
                adminControls.classList.remove('hidden');
                btnSaveDraft.classList.remove('hidden');
                btnPublish.classList.remove('hidden');
                btnAddPilota.classList.remove('hidden');
            } else {
                adminControls.classList.add('hidden');
                btnSaveDraft.classList.add('hidden');
                btnPublish.classList.add('hidden');
                btnAddPilota.classList.add('hidden');
            }

            openModal('modal-risultati');

            // Caricamento dati (bozza per admin, ufficiale per tutti)
            let data = [];
            let mode = 'empty';
            try {
                if (isAdmin) {
                    const draftRes = await apiCall(`/stage-results/${stageId}/draft`);
                    if (draftRes.success && draftRes.data.length > 0) {
                        data = draftRes.data; mode = 'draft';
                    } else {
                        const offRes = await apiCall(`/stage-results/${stageId}`);
                        if (offRes.success && offRes.data.length > 0) {
                            data = offRes.data; mode = 'official';
                        }
                    }
                } else {
                    const offRes = await apiCall(`/stage-results/${stageId}`);
                    if (offRes.success && offRes.data.length > 0) {
                        data = offRes.data; mode = 'official';
                    }
                }
            } catch (e) {
                console.error(e);
            }

            // Popola tabella
            if (data.length > 0) {
                data.forEach(r => addResultRow(r, !isAdmin));
            } else if (isAdmin) {
                addResultRow();
            } else {
                document.getElementById('risultati-tbody').innerHTML =
                    `<tr><td colspan="6" class="text-center py-6 text-slate-500">Nessun risultato pubblicato per questo stage.</td></tr>`;
            }

            // Banner stato
            const banner = document.getElementById('results-status-banner');
            banner.classList.remove('hidden');
            if (mode === 'draft') {
                banner.className = "mb-3 px-3 py-2 rounded text-sm bg-yellow-900/40 text-yellow-300 border border-yellow-700";
                banner.textContent = "BOZZA — non visibile al pubblico finché non premi Pubblica.";
            } else if (mode === 'official') {
                banner.className = "mb-3 px-3 py-2 rounded text-sm bg-green-900/40 text-green-300 border border-green-700";
                banner.textContent = "Risultati ufficiali pubblicati.";
            } else {
                banner.className = "mb-3 px-3 py-2 rounded text-sm bg-slate-800 text-slate-400 border border-slate-700";
                banner.textContent = "Nessun risultato.";
            }

            // Abilita Pubblica solo se c'è una bozza
            if (isAdmin) {
                if (mode === 'draft') {
                    btnPublish.disabled = false;
                    btnPublish.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    btnPublish.disabled = true;
                    btnPublish.classList.add('opacity-50', 'cursor-not-allowed');
                }
            }
        }

        function addResultRow(data = {}, readOnly = false) {
            const tbody = document.getElementById('risultati-tbody');
            const tr = document.createElement('tr');
            tr.className = "border-b border-slate-700/50 hover:bg-slate-800/30 transition-colors";

            const pos = tbody.children.length + 1;
            const disableAttr = readOnly ? 'disabled' : '';

            tr.innerHTML = `
                <td class="px-2 py-2 text-center font-bold text-slate-400 pos-col">${data.position || pos}</td>
                <td class="px-2 py-2"><input type="text" class="driver-input w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white focus:border-vrg-accent focus:outline-none ${readOnly ? 'opacity-70 cursor-not-allowed' : ''}" value="${data.driver_name || ''}" placeholder="Pilota" ${disableAttr}></td>
                <td class="px-2 py-2"><input type="text" class="car-input w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white focus:border-vrg-accent focus:outline-none ${readOnly ? 'opacity-70 cursor-not-allowed' : ''}" value="${data.car_model || ''}" placeholder="Auto" ${disableAttr}></td>
                <td class="px-2 py-2"><input type="text" class="time-input w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white font-mono focus:border-vrg-accent focus:outline-none ${readOnly ? 'opacity-70 cursor-not-allowed' : ''}" value="${data.time_str || ''}" placeholder="00:00.000" ${disableAttr}></td>
                <td class="px-2 py-2"><input type="text" class="penalty-input w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-white font-mono focus:border-vrg-accent focus:outline-none ${readOnly ? 'opacity-70 cursor-not-allowed' : ''}" value="${data.penalty || '-'}" placeholder="-" ${disableAttr}></td>
                <td class="px-2 py-2 text-center">
                    ${readOnly ? '' : `<button onclick="this.closest('tr').remove(); updateRowPositions();" class="text-red-400 hover:text-red-300 transition-colors"><i class="fa-solid fa-trash"></i></button>`}
                </td>
            `;
            tbody.appendChild(tr);
        }

        async function handleOcrUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('ocr-status');
            const btnUpload = document.getElementById('btn-upload-ocr');

            btnUpload.disabled = true;
            btnUpload.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Analisi in corso...';
            statusEl.textContent = "L'AI sta leggendo lo screen...";
            statusEl.className = "text-xs text-vrg-accent animate-pulse";

            const formData = new FormData();
            formData.append('screenshot', file);

            try {
                const response = await fetch('https://acr-backend-wv98.onrender.com/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success && data.parsed_data) {
                    document.getElementById('risultati-tbody').innerHTML = '';

                    if (data.parsed_data.length === 0) {
                        statusEl.textContent = "Nessun dato riconosciuto. Riprova con un'immagine più nitida.";
                        statusEl.className = "text-xs text-red-400";
                        addResultRow();
                    } else {
                        data.parsed_data.forEach(r => {
                            addResultRow({
                                driver_name: r.driver,
                                car_model: r.car,
                                time_str: r.time,
                                penalty: r.penalty,
                                position: r.position
                            });
                        });
                        statusEl.textContent = `Trovati ${data.parsed_data.length} piloti!`;
                        statusEl.className = "text-xs text-green-400";
                    }
                } else {
                    statusEl.textContent = "Errore AI: " + (data.error || "Sconosciuto");
                    statusEl.className = "text-xs text-red-400";
                }
            } catch (error) {
                console.error(error);
                statusEl.textContent = "Errore di connessione al server.";
                statusEl.className = "text-xs text-red-400";
            } finally {
                btnUpload.disabled = false;
                btnUpload.innerHTML = '<i class="fa-solid fa-camera"></i> Carica Screenshot (OCR)';
                event.target.value = '';
            }
        }

        function updateRowPositions() {
            const rows = document.querySelectorAll('#risultati-tbody tr');
            rows.forEach((tr, index) => {
                tr.querySelector('.pos-col').textContent = index + 1;
            });
        }

        // Handler pulsanti Salva bozza / Pubblica
        document.addEventListener('DOMContentLoaded', () => {
            const btnSaveDraft = document.getElementById('btn-save-draft');
            const btnPublish = document.getElementById('btn-publish');

            if (btnSaveDraft) {
                btnSaveDraft.addEventListener('click', async () => {
                    const stageId = parseInt(document.getElementById('input-risultati-stage-id').value);
                    const rows = document.querySelectorAll('#risultati-tbody tr');
                    const results = [];
                    rows.forEach((tr, index) => {
                        const driver = tr.querySelector('.driver-input')?.value.trim();
                        const car = tr.querySelector('.car-input')?.value.trim();
                        const time = tr.querySelector('.time-input')?.value.trim();
                        const penalty = tr.querySelector('.penalty-input')?.value.trim();
                        if (driver && time) {
                            results.push({ position: index + 1, driver, car, time, penalty });
                        }
                    });

                    if (results.length === 0) return alert("Inserisci almeno un pilota con il tempo.");

                    btnSaveDraft.disabled = true;
                    btnSaveDraft.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvataggio...';
                    try {
                        const res = await apiCall('/save-stage', 'POST', {
                            stage_id: stageId,
                            stage_name: "Update",
                            results: results
                        });
                        if (res.success) {
                            await loadTree();
                            await openStageResults(stageId);
                        } else {
                            alert("Errore: " + res.error);
                        }
                    } catch (e) {
                        alert("Errore durante il salvataggio: " + e.message);
                        console.error("Dettaglio errore:", e);
                    } finally {
                        btnSaveDraft.disabled = false;
                        btnSaveDraft.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Salva bozza';
                    }
                });
            }

            if (btnPublish) {
                btnPublish.addEventListener('click', async () => {
                    const stageId = parseInt(document.getElementById('input-risultati-stage-id').value);
                    if (!confirm("Pubblicare i risultati? Diventeranno visibili a tutti e sostituiranno gli eventuali ufficiali precedenti.")) return;

                    btnPublish.disabled = true;
                    btnPublish.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Pubblicazione...';
                    try {
                        const res = await apiCall(`/publish-stage/${stageId}`, 'POST', {});
                        if (res.success) {
                            await loadTree();
                            await openStageResults(stageId);
                        } else {
                            alert("Errore: " + res.error);
                        }
                    } catch (e) {
                        alert("Errore durante la pubblicazione: " + e.message);
                        console.error("Dettaglio errore:", e);
                    } finally {
                        btnPublish.disabled = false;
                        btnPublish.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Pubblica';
                    }
                });
            }
        });

        // =========================================================
        // DISCORD PUBLISH
        // =========================================================
        let discordCurrent = { entityType: null, entityId: null, entityName: null, published: false };

        async function openDiscordPublish(entityType, entityId, entityName) {
            discordCurrent = { entityType, entityId, entityName, published: false };

            const titleMap = {
                'stage': 'Pubblica stage su Discord',
                'leg': 'Pubblica classifica leg su Discord',
                'rally': 'Pubblica classifica rally su Discord',
                'championship': 'Pubblica classifica campionato su Discord'
            };
            document.getElementById('discord-modal-title').textContent = titleMap[entityType] || 'Pubblica su Discord';

            const webhookInput = document.getElementById('discord-webhook-input');
            const threadInput = document.getElementById('discord-thread-input');
            const banner = document.getElementById('discord-modal-banner');
            const confirmBtn = document.getElementById('btn-discord-confirm');

            webhookInput.value = '';
            threadInput.value = '';
            banner.classList.add('hidden');
            confirmBtn.disabled = true;
            confirmBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Caricamento...';

            openModal('modal-discord');

            try {
                const status = await apiCall(`/discord/status/${entityType}/${entityId}`);

             if (status.success) {
                    if (status.suggested_webhook) {
                        webhookInput.value = status.suggested_webhook;
                    }

                    discordCurrent.published = status.published === true;

                    if (status.published) {
                        banner.classList.remove('hidden');
                        banner.className = "mb-3 px-3 py-2 rounded text-sm bg-yellow-900/40 text-yellow-300 border border-yellow-700";
                        banner.textContent = "Già pubblicato su questo webhook. Il messaggio esistente verrà aggiornato (non duplicato).";
                        confirmBtn.innerHTML = '<i class="fa-solid fa-rotate"></i> Aggiorna su Discord';
                    } else if (status.reason === 'no_webhook') {
                        banner.classList.remove('hidden');
                        banner.className = "mb-3 px-3 py-2 rounded text-sm bg-slate-800 text-slate-400 border border-slate-700";
                        banner.textContent = "Nessun webhook configurato sul rally. Incolla un webhook per pubblicare.";
                        confirmBtn.innerHTML = '<i class="fa-brands fa-discord"></i> Pubblica';
                    } else {
                        confirmBtn.innerHTML = '<i class="fa-brands fa-discord"></i> Pubblica';
                    }
                }
            } catch (e) {
                banner.classList.remove('hidden');
                banner.className = "mb-3 px-3 py-2 rounded text-sm bg-red-900/40 text-red-300 border border-red-700";
                banner.textContent = "Errore nel caricamento stato: " + e.message;
            } finally {
                confirmBtn.disabled = false;
                updateDiscordConfirmState();
            }
        }

        function updateDiscordConfirmState() {
            const webhookInput = document.getElementById('discord-webhook-input');
            const confirmBtn = document.getElementById('btn-discord-confirm');
            confirmBtn.disabled = !webhookInput.value.trim();
        }

        // Abilita/disabilita il pulsante in base al contenuto del webhook
        document.addEventListener('DOMContentLoaded', () => {
            const webhookInput = document.getElementById('discord-webhook-input');
            if (webhookInput) {
                webhookInput.addEventListener('input', updateDiscordConfirmState);
            }

            const confirmBtn = document.getElementById('btn-discord-confirm');
            if (confirmBtn) {
                confirmBtn.addEventListener('click', async () => {
                    const webhook_url = document.getElementById('discord-webhook-input').value.trim();
                    const thread_id = document.getElementById('discord-thread-input').value.trim();
                    if (!webhook_url) return alert("Inserisci un webhook URL.");

                    const labelPubblicazione = discordCurrent.published ? "aggiornato" : "pubblicato";
                    const { entityType, entityId } = discordCurrent;

                    confirmBtn.disabled = true;
                    confirmBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Invio...';

                    try {
                        const body = { webhook_url };
                        if (thread_id) body.thread_id = thread_id;

                        const res = await apiCall(`/discord/publish/${entityType}/${entityId}`, 'POST', body);
                        if (res.success) {
                            const action = res.action;
                            if (action === 'recreated') {
                                alert("Il messaggio originale non esisteva più su Discord. Ne è stato creato uno nuovo.");
                            } else {
                                alert(`Messaggio ${labelPubblicazione} su Discord.`);
                            }
                            closeModal('modal-discord');
                        } else {
                            alert("Errore: " + (res.error || "sconosciuto"));
                        }
                    } catch (e) {
                        alert("Errore durante l'invio: " + e.message);
                        console.error(e);
                    } finally {
                        confirmBtn.disabled = false;
                        confirmBtn.innerHTML = discordCurrent.published
                            ? '<i class="fa-solid fa-rotate"></i> Aggiorna su Discord'
                            : '<i class="fa-brands fa-discord"></i> Pubblica';
                        updateDiscordConfirmState();
                    }
                });
            }
        });

        async function viewStandings(type, id) {
            const titleMap = {
                'rally': 'Classifica Rally (Punti)',
                'leg': 'Classifica Leg (Tempi)',
                'championship': 'Classifica Campionato'
            };
            document.getElementById('standings-title').textContent = titleMap[type] || 'Classifica';

            const tbody = document.getElementById('standings-tbody');
            const thead = document.querySelector('#modal-standings thead tr');

            if (type === 'rally') {
                thead.innerHTML = `
                    <th class="px-4 py-3 w-16">Pos</th>
                    <th class="px-4 py-3">Pilota</th>
                    <th class="px-4 py-3">Auto</th>
                    <th class="px-4 py-3">Punti</th>
                `;
            } else {
                thead.innerHTML = `
                    <th class="px-4 py-3 w-16">Pos</th>
                    <th class="px-4 py-3">Pilota</th>
                    <th class="px-4 py-3">Auto</th>
                    <th class="px-4 py-3">Tempo Totale</th>
                `;
            }

            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4"><i class="fa-solid fa-spinner fa-spin"></i> Calcolo in corso...</td></tr>`;
            openModal('modal-standings');

            try {
                const res = await apiCall(`/standings/${type}/${id}`);
                if (res.success && res.data.length > 0) {
                    tbody.innerHTML = '';
                    res.data.forEach(r => {
                        const statusColor = r.status !== 'completed' ? 'text-red-400' : 'text-slate-300';
                        const statusBadge = r.status !== 'completed' ? `<span class="text-[10px] bg-red-900/50 text-red-400 px-2 py-0.5 rounded ml-2">${r.status.toUpperCase()}</span>` : '';

                        let lastCol = '';
                        if (type === 'rally') {
                            lastCol = `<td class="px-4 py-2 font-bold text-vrg-accent">${r.points} pt</td>`;
                        } else {
                            lastCol = `<td class="px-4 py-2 font-mono text-vrg-accent">${r.total_str}</td>`;
                        }

                        tbody.innerHTML += `
                            <tr class="border-b border-slate-700/50 hover:bg-slate-800/30">
                                <td class="px-4 py-2 font-bold text-white">${r.position}°</td>
                                <td class="px-4 py-2 font-medium ${statusColor}">${r.driver} ${statusBadge}</td>
                                <td class="px-4 py-2 text-slate-500 text-xs">${r.car || '-'}</td>
                                ${lastCol}
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-500">Nessun dato disponibile.</td></tr>`;
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-red-400">Errore: ${e.message}</td></tr>`;
            }
        }
    </script>
