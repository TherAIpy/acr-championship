<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Campionato - ACR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vrg: { bg: '#0B1120', sidebar: '#0F172A', card: '#1E293B', accent: '#EAB308', text: '#94A3B8', textlight: '#F1F5F9' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-vrg-bg text-vrg-text font-sans h-screen flex overflow-hidden">

    <!-- SIDEBAR (Copia base) -->
    <aside class="w-64 bg-vrg-sidebar border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-6 flex items-center gap-3">
                <div class="text-vrg-accent text-2xl font-bold italic tracking-tighter">VRG</div>
            </div>
            <nav class="mt-4 px-3 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
                    <i class="fa-solid fa-arrow-left w-5"></i> Torna ai Campionati
                </a>
            </nav>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        
        <header class="h-20 bg-vrg-bg border-b border-slate-800 flex items-center justify-between px-8">
            <div class="flex items-center gap-4">
                <h1 id="header-title" class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-spinner fa-spin text-vrg-accent"></i> Caricamento...
                </h1>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-white">Rally del Campionato</h2>
                <button id="btn-add-rally" class="admin-only bg-vrg-accent hover:bg-yellow-500 text-black px-5 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors shadow-lg hidden">
                    <i class="fa-solid fa-plus"></i> Aggiungi Rally
                </button>
            </div>

            <div class="bg-vrg-card rounded-xl border border-slate-700 overflow-hidden">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="text-xs uppercase bg-slate-800/50 text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="px-6 py-4 font-semibold">Nome Rally</th>
                            <th class="px-6 py-4 font-semibold">Data Creazione</th>
                            <th class="px-6 py-4 font-semibold text-right">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="rally-tbody" class="divide-y divide-slate-700/50">
                        <!-- Popolato via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODALE AGGIUNGI RALLY -->
    <div id="modal-rally" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-vrg-card p-8 rounded-xl w-full max-w-md border border-slate-700 shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-4">Nuovo Rally</h2>
            <div class="mb-4">
                <label class="block text-sm text-slate-400 mb-2">Nome Rally</label>
                <input type="text" id="input-nome-rally" placeholder="Es. Rally di Montecarlo" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg px-4 py-2 focus:outline-none focus:border-vrg-accent">
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button id="btn-annulla-rally" class="px-5 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-700">Annulla</button>
                <button id="btn-salva-rally" class="bg-vrg-accent hover:bg-yellow-500 text-black px-5 py-2 rounded-lg text-sm font-bold">Salva</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>

    <script>
        // Prende l'ID del campionato dall'URL (es. ?id=1)
        const urlParams = new URLSearchParams(window.location.search);
        const champId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!champId) {
                alert("ID Campionato mancante nell'URL");
                window.location.href = 'dashboard.html';
                return;
            }

            await initAuthUI();
            loadChampionshipInfo();
            loadRallies();

            // Logica Modale
            const modal = document.getElementById('modal-rally');
            const btnAdd = document.getElementById('btn-add-rally');
            const btnAnnulla = document.getElementById('btn-annulla-rally');
            const btnSalva = document.getElementById('btn-salva-rally');

            btnAdd.addEventListener('click', () => { modal.classList.replace('hidden', 'flex'); });
            btnAnnulla.addEventListener('click', () => { modal.classList.replace('flex', 'hidden'); });

            btnSalva.addEventListener('click', async () => {
                const nome = document.getElementById('input-nome-rally').value.trim();
                if (!nome) return alert("Inserisci un nome");
                
                try {
                    await apiCall('/create-rally', 'POST', { championship_id: champId, name: nome });
                    modal.classList.replace('flex', 'hidden');
                    document.getElementById('input-nome-rally').value = '';
                    loadRallies();
                } catch (e) {
                    alert("Errore: " + e.message);
                }
            });
        });

        async function loadChampionshipInfo() {
            try {
                const res = await apiCall(`/championship/${champId}`);
                if (res.success) {
                    document.getElementById('header-title').innerHTML = `<i class="fa-solid fa-trophy text-vrg-accent"></i> ${res.data.name}`;
                }
            } catch (e) { console.error(e); }
        }

        async function loadRallies() {
            const tbody = document.getElementById('rally-tbody');
            try {
                const res = await apiCall(`/rallies/${champId}`);
                if (!res.success || res.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="text-center py-6 text-slate-500">Nessun rally. Aggiungine uno!</td></tr>`;
                    return;
                }
                
                tbody.innerHTML = '';
                res.data.forEach(rally => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-800/30 transition-colors";
                    tr.innerHTML = `
                        <td class="px-6 py-4 font-bold text-white">${rally.name}</td>
                        <td class="px-6 py-4">${new Date(rally.created_at).toLocaleDateString('it-IT')}</td>
                        <td class="px-6 py-4 text-right">
                            <button class="text-slate-500 hover:text-white transition-colors" title="Gestisci Leg e Stage">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-red-400">Errore di caricamento</td></tr>`;
            }
        }
    </script>
</body>
</html>
