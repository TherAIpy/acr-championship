<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACR Championship - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vrg: { bg: '#0B1120', sidebar: '#0F172A', card: '#1E293B', accent: '#EAB308', text: '#94A3B8', textlight: '#F1F5F9' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-vrg-bg text-vrg-text font-sans h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-vrg-sidebar border-r border-slate-800 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="p-6 flex items-center gap-3">
                <div class="text-vrg-accent text-2xl font-bold italic tracking-tighter">VRG</div>
                <div class="text-xs text-slate-500 font-semibold tracking-widest uppercase mt-1">Rally Series</div>
            </div>
            <nav class="mt-4 px-3 space-y-1">
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
                    <i class="fa-solid fa-house w-5"></i> Dashboard
                </a>
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg bg-slate-800 text-white border-l-4 border-vrg-accent">
                    <i class="fa-solid fa-trophy w-5 text-vrg-accent"></i> Campionati
                </a>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800">
            <div class="flex items-center gap-2 text-xs text-slate-500">
                <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
                Server Online
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- HEADER -->
        <header class="h-20 bg-vrg-bg border-b border-slate-800 flex items-center justify-between px-8 shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-trophy text-vrg-accent"></i> Campionati
                </h1>
            </div>
            
            <div class="flex items-center gap-6">
                <!-- Ricerca -->
                <div class="relative hidden lg:block">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-500"></i>
                    <input type="text" placeholder="Cerca un campionato..." class="bg-vrg-card text-sm text-white pl-10 pr-4 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-vrg-accent w-64 transition-colors">
                </div>
                
                <!-- Profilo Utente -->
                <div class="relative" id="user-profile-container">
                    <button id="btn-user-menu" class="flex items-center gap-3 focus:outline-none hover:opacity-80 transition-opacity">
                        <div id="user-avatar" class="w-10 h-10 rounded-full bg-slate-700 border border-slate-600 flex items-center justify-center text-white font-bold">?</div>
                        <div class="text-left hidden md:block">
                            <div id="user-name" class="text-sm font-bold text-white">Caricamento...</div>
                            <div id="user-role" class="text-xs text-slate-400">...</div>
                        </div>
                        <i class="fa-solid fa-chevron-down text-slate-400 text-xs"></i>
                    </button>

                    <div id="user-dropdown" class="absolute right-0 mt-3 w-56 bg-vrg-card border border-slate-700 rounded-xl shadow-2xl hidden z-50 overflow-hidden">
                        <div class="p-4 border-b border-slate-700 bg-slate-800/50">
                            <p class="text-sm font-bold text-white truncate" id="dropdown-email">email@esempio.com</p>
                            <p class="text-xs text-vrg-accent mt-1" id="dropdown-role">Admin</p>
                        </div>
                        <div class="p-2">
                            <button id="btn-logout" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-slate-800 rounded-lg transition-colors flex items-center gap-2">
                                <i class="fa-solid fa-power-off"></i> Disconnetti
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- CONTENUTO PAGINA -->
        <div class="flex-1 overflow-y-auto p-8">
            
            <!-- Toolbar (Filtri e Bottone Nuovo) -->
            <div class="flex justify-between items-center mb-6">
                <div class="flex gap-2">
                    <button class="bg-vrg-card text-white px-4 py-2 rounded-lg text-sm font-medium border border-slate-700">Tutti</button>
                    <button class="text-slate-400 hover:text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">In corso</button>
                    <button class="text-slate-400 hover:text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">Conclusi</button>
                </div>
                
                <button id="btn-nuovo-campionato" class="admin-only bg-vrg-accent hover:bg-yellow-500 text-black px-5 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors shadow-lg shadow-yellow-500/20 hidden">
                    <i class="fa-solid fa-plus"></i> Nuovo Campionato
                </button>
            </div>

            <!-- Tabella Campionati -->
            <div class="bg-vrg-card rounded-xl border border-slate-700 overflow-hidden">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="text-xs uppercase bg-slate-800/50 text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="px-6 py-4 font-semibold">Nome Campionato</th>
                            <th class="px-6 py-4 font-semibold">Stagione</th>
                            <th class="px-6 py-4 font-semibold">Rally</th>
                            <th class="px-6 py-4 font-semibold w-48">Progresso</th>
                            <th class="px-6 py-4 font-semibold">Classe Auto</th>
                            <th class="px-6 py-4 font-semibold">Partecipanti</th>
                            <th class="px-6 py-4 font-semibold">Stato</th>
                            <th class="px-6 py-4 font-semibold text-right">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="campionati-tbody" class="divide-y divide-slate-700/50">
                        <!-- Popolato via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODALE NUOVO CAMPIONATO -->
    <div id="modal-nuovo-campionato" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-vrg-card p-8 rounded-xl w-full max-w-md border border-slate-700 shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-trophy text-vrg-accent"></i> Crea Nuovo Campionato
            </h2>
            <div class="mb-4">
                <label class="block text-sm text-slate-400 mb-2">Nome Campionato</label>
                <input type="text" id="input-nome-campionato" placeholder="Es. VRG Summer Cup" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg px-4 py-2 focus:outline-none focus:border-vrg-accent">
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button id="btn-annulla" class="px-5 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-700 transition-colors">Annulla</button>
                <button id="btn-salva" class="bg-vrg-accent hover:bg-yellow-500 text-black px-5 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors shadow-lg shadow-yellow-500/20">
                    <i class="fa-solid fa-floppy-disk"></i> Salva
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT: RIMOSSO js/auth.js per evitare conflitti! -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Controllo Sessione e UI Utente
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            const user = session.user;
            const email = user.email;
            const initials = email.substring(0, 2).toUpperCase();
            const role = user.app_metadata?.role === 'admin' ? 'Amministratore' : 'Utente';

            // Aggiorna UI
            if (document.getElementById('user-avatar')) document.getElementById('user-avatar').textContent = initials;
            if (document.getElementById('user-name')) document.getElementById('user-name').textContent = email.split('@')[0];
            if (document.getElementById('user-role')) document.getElementById('user-role').textContent = role;
            if (document.getElementById('dropdown-email')) document.getElementById('dropdown-email').textContent = email;
            if (document.getElementById('dropdown-role')) document.getElementById('dropdown-role').textContent = role;

            // Mostra bottoni Admin
            if (role === 'Amministratore') {
                document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
            }

            // 2. Menu a tendina
            const btnMenu = document.getElementById('btn-user-menu');
            const dropdown = document.getElementById('user-dropdown');
            if (btnMenu && dropdown) {
                btnMenu.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdown.classList.toggle('hidden');
                });
                document.addEventListener('click', (e) => {
                    if (!btnMenu.contains(e.target) && !dropdown.contains(e.target)) {
                        dropdown.classList.add('hidden');
                    }
                });
            }

            // 3. Logout
            const btnLogout = document.getElementById('btn-logout');
            if (btnLogout) {
                btnLogout.addEventListener('click', async () => {
                    await supabase.auth.signOut();
                    window.location.href = 'login.html';
                });
            }

            // 4. Carica i Campionati
            loadChampionships();

            // 5. Logica Modale Nuovo Campionato
            const btnNuovo = document.getElementById('btn-nuovo-campionato');
            const modal = document.getElementById('modal-nuovo-campionato');
            const btnAnnulla = document.getElementById('btn-annulla');
            const btnSalva = document.getElementById('btn-salva');
            const inputNome = document.getElementById('input-nome-campionato');

            if (btnNuovo && modal) {
                btnNuovo.addEventListener('click', () => {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                });
            }

            if (btnAnnulla && modal) {
                btnAnnulla.addEventListener('click', () => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                });
            }

            if (btnSalva && modal && inputNome) {
                btnSalva.addEventListener('click', async () => {
                    const nome = inputNome.value.trim();
                    if (!nome) return alert('Inserisci un nome per il campionato');

                    btnSalva.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvataggio...';
                    btnSalva.disabled = true;

                    try {
                        const res = await api.saveChampionship({ name: nome });
                        if (res.success) {
                            modal.classList.add('hidden');
                            modal.classList.remove('flex');
                            inputNome.value = '';
                            loadChampionships();
                        } else {
                            alert('Errore: ' + (res.error || 'Sconosciuto'));
                        }
                    } catch (e) {
                        alert('Errore di connessione. Controlla la console (F12).');
                        console.error(e);
                    } finally {
                        btnSalva.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Salva';
                        btnSalva.disabled = false;
                    }
                });
            }
        });

        // Funzione per caricare la tabella
        async function loadChampionships() {
            const tbody = document.getElementById('campionati-tbody');
            if (!tbody) return;
            
            try {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Caricamento campionati...</td></tr>`;
                
                const response = await api.getChampionships();
                
                if (!response.success || response.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-slate-500">Nessun campionato trovato. Clicca "Nuovo Campionato" per iniziare.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                response.data.forEach(champ => {
                    const anno = new Date(champ.created_at).getFullYear();
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-800/30 transition-colors group";
                    tr.innerHTML = `
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-8 rounded bg-slate-700 overflow-hidden flex items-center justify-center">
                                    <i class="fa-solid fa-trophy text-slate-500"></i>
                                </div>
                                <div>
                                    <div class="font-bold text-white text-base">${champ.name}</div>
                                    <div class="text-xs text-slate-500">Creato il ${new Date(champ.created_at).toLocaleDateString('it-IT')}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4">${anno}</td>
                        <td class="px-6 py-4 font-medium">- / -</td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div class="w-full bg-slate-700 rounded-full h-1.5">
                                    <div class="bg-vrg-accent h-1.5 rounded-full" style="width: 0%"></div>
                                </div>
                                <span class="text-xs font-bold text-white w-8">0%</span>
                            </div>
                        </td>
                        <td class="px-6 py-4">-</td>
                        <td class="px-6 py-4 flex items-center gap-2">
                            <i class="fa-solid fa-users text-slate-500"></i> 0
                        </td>
                        <td class="px-6 py-4">
                            <span class="bg-slate-700 text-slate-300 px-3 py-1 rounded-full text-xs font-medium border border-slate-600">In corso</span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="window.location.href='championship-detail.html?id=${champ.id}'" class="text-slate-500 hover:text-vrg-accent transition-colors">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Errore nel caricamento:", error);
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-red-400">Errore nel caricamento dei dati. Backend offline o problema di rete.</td></tr>`;
            }
        }
    </script>
</body>
</html>
